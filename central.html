  document.querySelectorAll('.task[onclick*="openModal(\'task\'"]').forEach(el=>{const id=(el.getAttribute('onclick').match(/openModal\('task','([^']+)'/)||[])[1];const t=db.tasks.find(x=>x.id===id);if(!t)return;const foot=el.querySelector('.taskfoot');const L=t.checklist||[];const done=L.filter(c=>t.checkDone?.[c]).length;if(foot&&L.length)foot.insertAdjacentHTML('beforeend',`<span class="cx-chk ${done===L.length?'ok':''}">☑ ${done}/${L.length}</span>`);if(t.due&&t.status!=='done'&&t.due<dateISO())el.classList.add('late')});
}
function cxPick(){cxModal('Entrar na área de uma mentorada',`<input class="input" placeholder="🔎 Buscar pelo nome" oninput="filterRows(this.value,'cxPickRow')" style="margin-bottom:12px">${db.students.map(s=>`<div class="minirow cxPickRow v8-clickable" data-key="${esc(s.name.toLowerCase())}" onclick="closeModal();switchMode('student','${s.id}')"><div class="namecell"><div class="avatar">${initials(s.name)}</div><div><b>${esc(s.name)}</b><br><small>${esc(s.program)} · ${s.portal.released?(s.portal.hasLogin?'já entra na Central':'liberada, sem senha ainda'):'Central ainda não liberada'}</small></div></div><b>Abrir →</b></div>`).join('')||'<div class="empty">Nenhuma mentorada ativa na WL.</div>'}`)}
function cxNewPlan(){cxModal('Novo plano de ação para '+me().name,`<p>Escolha um modelo pronto da sua biblioteca ou comece um quadro em branco.</p><div class="grid two">${db.models.map(m=>`<div class="resource" onclick="openModal('assign','${m.id}')"><div class="designbar" style="background:${m.color}"></div><h3>${esc(m.title)}</h3><p>${esc(m.description||'')}</p><small>${m.tasks.length} tarefas</small></div>`).join('')}<div class="resource" onclick="openModal('board')"><div class="designbar" style="background:#ccc"></div><h3>＋ Quadro em branco</h3><p>Crie as tarefas do zero.</p></div></div>`,{wide:true})}

/* ---------- Visão geral da mentora ---------- */
const cxAdminDash0=adminDashboard;
adminDashboard=function(){let html=cxAdminDash0();const rows=db.students.map(s=>{const bs=db.boards.filter(b=>b.studentId===s.id),ts=db.tasks.filter(t=>bs.some(b=>b.id===t.boardId));const done=ts.filter(t=>t.status==='done').length,rev=ts.filter(t=>t.status==='review').length,late=ts.filter(t=>t.status!=='done'&&t.due&&t.due<dateISO()).length;return {s,bs,ts,done,rev,late,pct:ts.length?Math.round(done/ts.length*100):0}});
  const soon=db.students.filter(s=>s.birthday&&daysToBday(s.birthday)<=7);
  const card=`${soon.length?`<div class="cx-bday">🎂 ${soon.map(s=>`<b>${esc(s.name.split(' ')[0])}</b> ${daysToBday(s.birthday)===0?'faz aniversário <b>hoje</b>':'faz aniversário em '+daysToBday(s.birthday)+' dia(s) ('+fmt(s.birthday).slice(0,5)+')'}${ageOf(s.birthday)!==''?` · ${ageOf(s.birthday)+(daysToBday(s.birthday)===0?0:1)} anos`:''} ${s.phone?`<a class="btn white sm" target="_blank" rel="noopener" href="https://wa.me/55${String(s.phone).replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'')}?text=${encodeURIComponent((db.settings.birthdayMessage||'').replace(/{{nome}}/g,s.name.split(' ')[0]))}">Parabenizar</a>`:''}`).join(' &nbsp;·&nbsp; ')}</div>`:''}
  <div class="card" style="margin-bottom:18px"><div class="flex wrap" style="justify-content:space-between"><div><h2 style="margin:0">💜 Mentoradas na Central</h2><p style="margin:4px 0 0">Progresso dos planos, tarefas para revisar e último acesso de cada uma.</p></div><div class="actionrow">${button('⚙ Primeiros passos',`CXF.editor()`,'white sm')}${button('Entrar na área de uma mentorada',`cxPick()`,'sm')}</div></div><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>Mentorada</th><th>Plano de ação</th><th>Revisar</th><th>Atrasadas</th><th>Último acesso</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr class="student-table-row" onclick="if(!event.target.closest('button'))switchMode('student','${r.s.id}')"><td><div class="namecell"><div class="avatar">${initials(r.s.name)}</div><div><b>${esc(r.s.name)}</b><br><small>${esc(r.s.wlStatus||r.s.program)}</small></div></div></td><td style="min-width:150px"><div class="progress"><div style="width:${r.pct}%"></div></div><small>${r.done}/${r.ts.length} tarefas · ${r.bs.length} plano(s)</small></td><td>${r.rev?chip(r.rev+' em revisão','yellow'):'<small>—</small>'}</td><td>${r.late?chip(r.late+' atrasada(s)','red'):'<small>—</small>'}</td><td><small>${r.s.portal.lastSeen?new Date(r.s.portal.lastSeen).toLocaleDateString('pt-BR'):r.s.portal.released?'nunca entrou':'não liberada'}</small></td><td>${button('Abrir área →',`switchMode('student','${r.s.id}')`,'soft sm')}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Nenhuma mentorada ativa na WL ainda.</div></td></tr>'}</tbody></table></div></div>`;
  const i=html.indexOf('<div class="grid two"');return i>=0?html.slice(0,i)+card+html.slice(i):html+card};

/* ---------- Mentoradas (cards completos) ---------- */
adminStudents=function(){return `${header('Mentoradas','Todas as mentoradas da WL Command. Abra a área de cada uma para editar planos, encontros e tudo mais.',button('+ Nova mentorada',"openModal('student')"))}<div class="card"><input class="input" style="max-width:450px;margin-bottom:18px" placeholder="🔎 Encontre pelo nome, e-mail ou programa" oninput="filterRows(this.value,'studentRow')"><div class="grid three">${db.students.map(s=>{const bs=db.boards.filter(b=>b.studentId===s.id),ts=db.tasks.filter(t=>bs.some(b=>b.id===t.boardId));const pct=ts.length?Math.round(ts.filter(t=>t.status==='done').length/ts.length*100):0;return `<div class="resource cx-scard studentRow" data-key="${esc((s.name+' '+s.email+' '+s.program).toLowerCase())}"><div class="flex"><div class="avatar">${initials(s.name)}</div><div style="min-width:0"><b>${esc(s.name)}</b><br><small>${esc(s.email||'sem e-mail')}</small></div></div><p style="margin:12px 0 6px">${chip(docStatus[s.contract]?.[0]||'Pendente',docStatus[s.contract]?.[1]||'yellow')} ${s.portal.released?chip(s.portal.status==='bloqueado'?'Bloqueada':'Central liberada',s.portal.status==='bloqueado'?'red':'green'):chip('Central não liberada','yellow')}</p><div class="minirow"><span>Programa</span><b>${esc(s.program)}</b></div><div class="minirow"><span>Vigência</span><b>${s.joined?fmt(s.joined):'?'} → ${s.end?fmt(s.end):'?'}</b></div><div class="minirow"><span>Aniversário</span><b>${s.birthday?fmt(s.birthday).slice(0,5)+(isBdayToday(s.birthday)?' 🎂 hoje!':''):'<small>não informado</small>'}</b></div><div class="minirow"><span>Plano de ação</span><b>${pct}% · ${ts.length} tarefas</b></div><div class="actionrow" style="margin-top:14px">${button('↗ Abrir área',`switchMode('student','${s.id}')`,'sm')}${button('⚙ Gerenciar',`openModal('manageStudent','${s.id}')`,'white sm')}<a class="btn white sm" target="_blank" rel="noopener" href="${WL_URL}#/mentor/${encodeURIComponent(s.id)}">Ficha na WL</a></div></div>`}).join('')||'<div class="empty">Nenhuma mentorada ativa na WL.</div>'}</div></div>`};

/* ---------- Painel da mentorada (saguão) ---------- */
const cxStudentDash0=studentDashboard;
studentDashboard=function(){let html=cxStudentDash0();const s=me();if(!s)return html;const today=dateISO();
  const next=db.meetings.filter(m=>m.studentId===s.id&&m.date>=today&&!m.done).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))[0];
  const book=s.wl.booking||db.settings.calendarUrl||'';const days=next?Math.round((new Date(next.date+'T12:00:00')-new Date(today+'T12:00:00'))/864e5):null;
  const bday=isBdayToday(s.birthday)?`<div class="cx-bday big">🎂 Feliz aniversário, ${esc(s.name.split(' ')[0])}! Que o seu novo ciclo seja cheio de conquistas. Com carinho, Waleska 💜</div>`:'';
  const strip=`${bday}<div class="grid two cx-lobby"><div class="card cx-next"><div class="eyebrow">PRÓXIMO ENCONTRO</div>${next?`<h2 style="margin:4px 0">${esc(next.title)}</h2><p style="margin:0 0 12px">${new Date(next.date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}${next.time?' às '+esc(next.time):''}</p><div class="cx-count"><b>${days===0?'Hoje':days===1?'Amanhã':days}</b>${days>1?'<span>dias</span>':''}</div><div class="actionrow">${next.link?`<a class="btn" target="_blank" rel="noopener" href="${esc(next.link)}">Entrar na sala</a>`:''}<a class="btn white" target="_blank" rel="noopener" href="${gcal('Mentoria · '+next.title,next.date,next.time,60,'Encontro da Mentoria Escala Inteligente com Waleska Lima',next.link)}">📅 Adicionar ao Google Agenda</a></div>`:`<h2 style="margin:4px 0">Nenhum encontro marcado</h2><p>Escolha o melhor dia e horário na agenda da mentora.</p>${book?`<a class="btn" target="_blank" rel="noopener" href="${esc(book)}">📅 Agendar meu encontro</a>`:''}`}</div>
  <div class="card cx-mentor"><div class="flex"><div class="avatar" style="width:52px;height:52px;font-size:18px">WL</div><div><div class="eyebrow" style="margin:0">SUA MENTORA</div><h2 style="margin:2px 0 0">${esc(s.wl.mentora||'Waleska Lima')}</h2></div></div><p style="margin:12px 0">${esc(s.wl.supportHours||'Suporte pelo seu grupo individual no WhatsApp.')}</p><div class="actionrow">${s.wl.group?`<a class="btn green" target="_blank" rel="noopener" href="${esc(s.wl.group)}">💬 Grupo de suporte</a>`:''}${button('Abrir suporte',"setPage('support')",'soft')}${book?`<a class="btn white" target="_blank" rel="noopener" href="${esc(book)}">Agenda</a>`:''}</div></div></div>${CXF.card()}`;
  const i=html.indexOf('<div class="grid">');return i>=0?html.slice(0,i)+strip+html.slice(i):strip+html};

/* ---------- Encontros (visão da mentorada) ---------- */
const cxMeet0=meetingsPage;
meetingsPage=function(){if(mode!=='student')return cxMeet0();const s=me();const today=dateISO();const L=db.meetings.filter(m=>m.studentId===s.id);const up=L.filter(m=>m.date>=today&&!m.done),past=L.filter(m=>!(m.date>=today&&!m.done)).reverse();const book=s.wl.booking||db.settings.calendarUrl;
  return `${header('Mentorias e gravações','Sua agenda de encontros, gravações e resumos.')}<div class="banner"><div><div class="eyebrow">📅 AGENDE O SEU ENCONTRO</div><h1 style="font-size:24px">Um encontro por janela da mentoria</h1><p>Você escolhe o dia e o horário na agenda da mentora, dentro do período contratado. Chegue com o seu plano de ação aberto.</p></div>${book?`<a class="btn white" target="_blank" rel="noopener" href="${esc(book)}">Abrir agenda</a>`:''}</div>
  ${(s.wl.windows||[]).length?`<div class="card" style="margin-bottom:18px"><h2>Janelas dos encontros</h2><div class="cx-windows">${s.wl.windows.map(w=>`<div class="cx-win ${w.end<today?'past':w.ini<=today?'now':''}"><b>${w.n||''} encontro(s)</b><small>${fmt(w.ini)} a ${fmt(w.end)}</small></div>`).join('')}</div></div>`:''}
  <div class="grid two" style="align-items:start"><div class="card"><h2>Próximos encontros</h2>${up.map(m=>`<div class="minirow"><span><b>${esc(m.title)}</b><br><small>${fmt(m.date)} ${esc(m.time||'')}</small></span><span class="actionrow">${m.link?`<a class="btn sm" target="_blank" rel="noopener" href="${esc(m.link)}">Entrar</a>`:''}<a class="btn white sm" target="_blank" rel="noopener" href="${gcal('Mentoria · '+m.title,m.date,m.time,60,'Encontro da mentoria',m.link)}">📅 Google Agenda</a></span></div>`).join('')||'<p>Nenhum encontro marcado ainda.</p>'}</div>
  <div class="card"><h2>Gravações e resumos</h2>${past.map(m=>`<div class="cx-meet"><div class="flex" style="justify-content:space-between"><b>${esc(m.title)}</b><small>${fmt(m.date)}</small></div>${m.notes?`<p style="white-space:pre-wrap;margin:6px 0">${esc(m.notes)}</p>`:''}<div class="actionrow">${m.recording?`<a class="btn soft sm" target="_blank" rel="noopener" href="${esc(m.recording)}">▶ Assistir gravação</a>`:'<small>Gravação ainda não disponível</small>'}${(m.links||[]).map(l=>`<a class="btn white sm" target="_blank" rel="noopener" href="${esc(l.url||l)}">${esc(l.label||l.name||'Link')}</a>`).join('')}</div></div>`).join('')||'<p>As gravações dos seus encontros aparecem aqui.</p>'}</div></div>`};

/* ---------- Contrato ---------- */
renderContract=function(){const s=me();if(!s)return '';const c=s.contractInfo;const st=docStatus[s.contract]||docStatus.pending;
  return `${header('Meu contrato','O seu contrato da mentoria, assinado digitalmente.')}<div class="grid two" style="align-items:start"><div class="card"><div class="flex" style="justify-content:space-between"><h2 style="margin:0">${esc(s.program)}</h2>${chip(c?.status||st[0],st[1])}</div><div class="spacer"></div><div class="minirow"><span>Mentorada</span><b>${esc(s.name)}</b></div><div class="minirow"><span>Início</span><b>${fmt(s.joined)}</b></div><div class="minirow"><span>Encerramento</span><b>${fmt(s.end)}</b></div><div class="minirow"><span>Encontros</span><b>${s.meetings}</b></div><div class="actionrow" style="margin-top:16px">${c?.signedUrl?`<a class="btn" target="_blank" rel="noopener" href="${esc(c.signedUrl)}">📄 Abrir contrato assinado</a>`:`<span class="help">${s.contract==='review'?'O contrato foi enviado para assinatura pela Autentique. Confira o seu e-mail.':'O contrato ainda está sendo preparado pela mentora.'}</span>`}</div></div>
  <div class="card"><h2>Como funcionam os encontros</h2>${(s.wl.windows||[]).length?`<div class="cx-windows">${s.wl.windows.map(w=>`<div class="cx-win"><b>${w.n||''} encontro(s)</b><small>${fmt(w.ini)} a ${fmt(w.end)}</small></div>`).join('')}</div>`:''}<p>Os encontros acontecem dentro de cada janela do período contratado. Encontro não agendado dentro da janela não acumula para a próxima. Dúvidas? Fale no seu grupo de suporte.</p>${button('Ir para Mentorias e gravações',"setPage('meetings')",'soft')}</div></div>`};
adminContracts=function(){return `${header('Contratos','Status dos contratos de cada mentorada. Os contratos são gerados e enviados para a Autentique pela WL Command.')}<div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Mentorada</th><th>Status na WL</th><th>Contrato assinado</th><th></th></tr></thead><tbody>${db.students.map(s=>`<tr><td><b>${esc(s.name)}</b><br><small>${esc(s.program)}</small></td><td>${chip(s.contractInfo?.status||'Sem contrato',docStatus[s.contract]?.[1]||'yellow')}</td><td>${s.contractInfo?.signedUrl?`<a class="btn soft sm" target="_blank" rel="noopener" href="${esc(s.contractInfo.signedUrl)}">Abrir PDF</a>`:'<small>—</small>'}</td><td><a class="btn white sm" target="_blank" rel="noopener" href="${WL_URL}#/mentor/${encodeURIComponent(s.id)}">Abrir na WL</a></td></tr>`).join('')}</tbody></table></div></div>`};

/* ---------- Diagnóstico (formulário de entrada) ---------- */
renderDiagnosis=function(){const s=me();if(!s)return '';let qa=[];if(s.wl.diag&&Object.keys(s.wl.diag).length)qa=Object.entries(s.wl.diag).filter(([k,v])=>MF_LABELS_CX[k]&&String(v||'').trim()&&!['email','celular','nome'].includes(k)).map(([k,v])=>[MF_LABELS_CX[k],v]);if(!qa.length&&s.wl.diagnosis)qa=Object.entries(s.wl.diagnosis);
  const pick=re=>qa.find(([l])=>re.test(l))?.[1]||'';
  return `${header(mode==='admin'?'Diagnóstico de '+s.name:'Meu diagnóstico','As respostas do formulário de entrada da mentoria. É a base do seu plano de ação.')}${qa.length?`<div class="grid">${metric('🎯','Principal meta',esc(String(pick(/meta/i)).slice(0,40)||'—'),'')}${metric('💰','Faturamento 30 dias',esc(String(pick(/30 dias/i)).slice(0,24)||'—'),'no início da mentoria')}${metric('🧭','Nicho',esc(String(pick(/^Nicho/i)).slice(0,30)||'—'),'')}${metric('⏳','Tempo no digital',esc(String(pick(/Tempo no digital/i)).slice(0,24)||'—'),'')}</div><div class="cx-qa">${qa.map(([l,v])=>`<div class="card"><div class="overline">${esc(l)}</div><p style="white-space:pre-wrap;margin:8px 0 0;color:var(--dark)">${esc(v)}</p></div>`).join('')}</div>${mode==='student'?`<p class="help" style="margin-top:12px">Encontrou algo para corrigir? ${button('Pedir correção','openModal("v8Profile")','soft sm')}</p>`:''}`:`<div class="empty">${mode==='admin'?'Ela ainda não respondeu o formulário de entrada. O link é gerado na WL (Mentorias › ficha › Formulário).':'O seu formulário de entrada ainda não foi respondido. Procure o link que a sua mentora enviou no WhatsApp.'}</div>`}`};

/* ---------- Resultados: parcelas da mentoria (visão da aluna) ---------- */
const cxFin0=financePage;
financePage=function(){const html=cxFin0();const s=me();if(mode!=='student'||!s?.wl.finance?.length)return html;return html+`<div class="card" style="margin-top:18px"><h2>💳 Parcelas da sua mentoria</h2>${s.wl.finance.map(f=>`<div class="minirow"><span><b>${esc(f.name||'Parcela')}</b><br><small>Vencimento ${fmt(f.date)}</small></span><span class="actionrow">${chip(f.status||'Em aberto',/pago/i.test(f.status)?'green':/atras/i.test(f.status)?'red':'yellow')} <b>${money(f.amount)}</b>${f.link&&!/pago/i.test(f.status)?`<a class="btn sm" target="_blank" rel="noopener" href="${esc(f.link)}">Pagar</a>`:''}</span></div>`).join('')}</div>`};

/* ---------- Configurações: textos da central ---------- */
const cxSettings0=settingsPage;
settingsPage=function(){let html=cxSettings0();html=html.replace(/<div class="notice[^"]*">[^<]*(demonstra|protótipo|navegador)[^<]*<\/div>/gi,'');return html+`<div class="card" style="margin-top:18px"><h2>Central Magnética</h2><p>Dados salvos na nuvem (Supabase), ligados à WL Command. Mentoradas, contratos, diagnóstico e encontros oficiais vêm da WL.</p><div class="actionrow">${button('⚙ Primeiros passos das alunas',`CXF.editor()`,'soft')}${button('↻ Recarregar dados da WL',`CX.load().then(()=>{render();toast('Atualizado')})`,'white')}</div></div>`};
exportDemo=()=>toast('Os dados ficam salvos na nuvem e têm cópia de segurança.');resetDemo=()=>toast('Ação desativada na Central conectada.');

CXBoot.start();
</script></body></html>
