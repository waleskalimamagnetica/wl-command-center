reções'],['community','♡','Comunidade'],['calendar','▦','Minha agenda'],['notifications','🔔','Notificações']];function setPage(p){page=p;subPage=null;search='';menuOpen=false;render()}function switchMode(m,id){mode=m;if(id)studentId=id;page='dashboard';subPage=null;menuOpen=false;render()}function render(){const student=me();const limited=mode==='student'&&!student.diagnostic;const locked=mode==='student'&&student.diagnostic&&(student.contract==='rejected'||!student.active);if(limited&&page!=='diagnosis'){page='diagnosis'}if(locked&&!['contract','diagnosis','notifications'].includes(page))page='contract';let nav=mode==='admin'?adminMenu:studentMenu;let side=`<aside class="sidebar ${menuOpen?'open':''}"><div class="brand"><div class="logo">M</div><div><b>Magnética<span style="color:var(--purple)">MEI</span></b><small>SISTEMA DE MENTORIA</small></div></div><div class="nav-section">${mode==='admin'?'ADMINISTRAÇÃO':'ESPAÇO DA MENTORADA'}</div>${nav.map(a=>`<button class="nav ${page===a[0]?'active':''}" onclick="setPage('${a[0]}')"><span class="ico">${a[1]}</span>${a[2]}${a[0]==='notifications'&&db.notifications.filter(n=>(mode==='admin'?false:n.studentId===studentId)&&!n.read).length?'<span class="counter">●</span>':''}</button>`).join('')}<div class="side-bottom">${mode==='admin'?`<button class="nav" onclick="switchMode('student','${studentId}')">⇄ &nbsp; Testar visão da mentorada</button>`:`<button class="nav" onclick="switchMode('admin')">⇄ &nbsp; Voltar ao administrador</button>`}<div class="notice" style="font-size:11px">DEMONSTRAÇÃO LOCAL<br>Dados salvos apenas neste navegador. Não use dados pessoais verdadeiros.</div></div></aside>`;let body;if(limited)body=renderDiagnosis(true);else if(locked)body=renderContract();else body=renderPage();document.getElementById('app').innerHTML=`<div class="app">${side}<main class="main"><header class="topbar"><div class="flex"><button class="circlebtn mobilemenu" onclick="menuOpen=!menuOpen;render()">☰</button><span class="top-t function renderPage(){if(mode==='admin'){return ({dashboard:adminDashboard,students:adminStudents,models:adminModels,boards:boardsPage,lessons:lessonsPage,prompts:promptsPage,contracts:adminContracts,meetings:meetingsPage,calendar:calendarPage,notifications:notificationsPage,support:supportPage,finance:financePage,rewards:rewardsPage,settings:settingsPage})[page]?.()||adminDashboard()}return ({dashboard:studentDashboard,diagnosis:()=>renderDiagnosis(false),contract:renderContract,lessons:lessonsPage,boards:boardsPage,meetings:meetingsPage,finance:financePage,prompts:promptsPage,library:libraryPage,projects:projectsPage,rewards:rewardsPage,support:supportPage,community:communityPage,calendar:calendarPage,notifications:notificationsPage})[page]?.()||studentDashboard()}
function adminDashboard(){let act=db.activity.slice(0,7);let birthdays=db.students.filter(s=>s.birthday).map(s=>({s,date:s.birthday.slice(5)})).sort((a,b)=>a.date.localeCompare(b.date));let missing=db.meetings.filter(m=>!m.recording);return `${hero('Sua operação, em um só lugar.','Acompanhe mentoradas, contratos, tarefas, encontros e cada movimento da sua mentoria.',button('+ Cadastrar mentorada',"openModal('student')",'white'))}<div class="grid">${metric('👩‍🎓','Mentoradas',db.students.length,'Cadastradas na plataforma')}${metric('📋','Contratos para conferir',db.students.filter(s=>s.contract==='review').length,'Envios aguardando sua análise')}${metric('✅','Tarefas em revisão',db.tasks.filter(t=>t.status==='review').length,'Precisam da sua avaliação')}${metric('🎬','Gravações pendentes',missing.length,'Encontros sem link cadastrado')}</div><div class="grid two" style="margin-top:18px"><div class="card"><div class="flex" style="justify-content:space-between"><h2>⚡ Sua fila de atenção</h2>${button('Ver mentoradas',"setPage('students')",'soft sm')}</div>${db.students.filter(s=>s.contract==='review').map(s=>`<div class="minirow"><span>📄 Contrato de <b>${esc(s.name)}</b> aguardando validação</span>${button('Analisar',`openModal('contractReview','${s.id}')`,'sm')}</div>`).join('')}${missing.map(m=>`<div class="minirow"><span>🎥 Gravação pendente: ${esc(getStudent(m.studentId)?.name)} · ${fmt(m.date)}</span>${button('Adicionar',`openModal('meeting','${m.id}')`,'soft sm')}</div>`).join('')}${db.tasks.filter(t=>t.status==='review').map(t=>`<div class="minirow"><span>📋 Tarefa em revisão: ${esc(t.title)}</span>${button('Abrir',`openModal('task','${t.id}')`,'soft sm')}</div>`).join('')||'<div class="empty">Tudo em dia 🎉</div>'}</div><div class="card"><div class="flex" style="justify-content:space-between"><h2>🎂 Aniversários e datas</h2>${button('Calendário',"setPage('calendar')",'soft sm')}</div>${birthdays.map(b=>`<div class="minirow"><div class="flex"><div class="avatar">${initials(b.s.name)}</div><span><b>${esc(b.s.name)}</b><br><small>${b.date.split('-').reverse().join('/')}</small></span></div>${button('WhatsApp',`sendWA('${b.s.id}','birthday')`,'white sm')}</div>`).join('')}</div></div><div class="card" style="margin-top:18px"><div class="flex" style="justify-content:space-between"><h2>Atividade recente</h2>${button('Ver tudo',"setPage('notifications')",'soft sm')}</div>${activityList(act)}</div>`}

function adminStudents(){return `${header('Gestão de mentoradas','Cadastre, organize, acompanhe e acesse a visão de cada aluna.',button('+ Nova mentorada',"openModal('student')"))}<div class="card"><div class="toolbar"><input class="input" placeholder="Buscar aluna por nome ou e-mail..." oninput="filterRows(this.value,'studentRow')"></div><div class="tablewrap"><table class="table"><thead><tr><th>Mentorada</th><th>Programa</th><th>Vigência</th><th>Contrato</th><th>Acesso</th><th>Ações</th></tr></thead><tbody>${db.students.map(s=>`<tr class="studentRow" data-key="${esc((s.name+' '+s.email).toLowerCase())}"><td><div class="namecell"><div class="avatar">${initials(s.name)}</div><div><b>${esc(s.name)}</b><br><small>${esc(s.email)}</small></div></div></td><td>${esc(s.program||'MEI')}<br><small>${s.months} meses · ${s.meetings} encontros</small></td><td>${s.firstCall?fmt(s.firstCall):'Aguardando 1ª call'}</td><td>${chip(docStatus[s.contract]?.[0]||'Pendente',docStatus[s.contract]?.[1]||'yellow')}</td><td>${chip(s.active?'Ativo':'Suspenso',s.active?'green':'red')}</td><td><div class="actionrow">${button('Gerenciar',`openModal('student','${s.id}')`,'soft sm')}${button('Entrar como',`switchMode('student','${s.id}')`,'white sm')}</div></td></tr>`).join('')}</tbody></table></div></div>`}

function adminModels(){return `${header('Biblioteca de planos prontos','Crie modelos reutilizáveis e atribua a qualquer mentorada.',button('+ Novo modelo',"openModal('model')"))}<div class="grid three">${db.models.map(m=>`<div class="resource"><div class="designbar" style="background:${m.color}"></div><div class="flex" style="justify-content:space-between"><div class="resourceicon">▦</div>${chip(m.tasks.length+' tarefas')}</div><h2>${esc(m.title)}</h2><p>${esc(m.description)}</p><div class="actionrow">${button('Aplicar à aluna',`openModal('assign','${m.id}')`,'sm')}${button('Editar',`openModal('model','${m.id}')`,'soft sm')}${button('Excluir',`deleteRecord('models','${m.id}')`,'danger sm')}</div></div>`).join('')}</div><div class="notice">Quando você aplica um modelo, o sistema cria uma cópia independente. Alterações posteriores no modelo não modificam os Kanbans já atribuídos.</div>`}
function boardsPage(){let s=me(),bs=db.boards.filter(b=>b.studentId===s.id);if(subPage&&subPage.kind==='board'&&!bs.some(b=>b.id===subPage.id))subPage=null;let board=bs.find(b=>b.id===(subPage?.id||selectedBoard))||bs[0];return `${header(mode==='admin'?'Planos de ação':'Meus planos de ação',mode==='admin'?`Gerenciando: ${s.name}`:'Organize suas entregas e acompanhe seus resultados.',mode==='admin'?button('+ Novo quadro',"openModal('board')"):'')}${!bs.length?`<div class="empty">${mode==='admin'?'Nenhum quadro criado. Adicione um plano para esta mentorada.':'Seu primeiro plano personalizado será liberado após a primeira call.'}</div>`:`<div class="tabs">${bs.map(b=>`<button class="tab ${board?.id===b.id?'active':''}" onclick="selectedBoard='${b.id}';subPage={kind:'board',id:'${b.id}'};render()">${esc(b.title)}</button>`).join('')}</div><div class="card" style="padding:18px"><div class="flex wrap" style="justify-content:space-between;margin-bottom:16px"><div><h2 style="margin:0">${esc(board.title)}</h2><p style="margin:5px 0">${esc(board.description||'Seu quadro de ações e entregas')}</p></div><div class="actionrow">${mode==='admin'?button('Editar quadro',`openModal('board','${board.id}')`,'white sm'):''}${button('+ Adicionar tarefa',`openModal('taskNew','${board.id}')`,'sm')}</div></div><div class="kanban">${statuses.map(status=>`<div class="lane" ondragover="event.preventDefault()" ondrop="dropTask(event,'${status[0]}')"><div class="lanehead"><span class="statusdot" style="background:${status[2]}"></span>${status[1]} <span class="count">${db.tasks.filter(t=>t.boardId===board.id&&t.status===status[0]).length}</span></div>${db.tasks.filter(t=>t.boardId===board.id&&t.status===status[0]).map(t=>`<div class="task" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${t.id}')" onclick="openModal('task','${t.id}')"><div class="colorbar" style="background:${priorityColors[t.priority]||priorityColors.purple}"></div><b>${esc(t.title)}</b><p style="font-size function lessonsPage(){let cat=db.categories.find(c=>c.id===subPage?.id);let phase=db.phases.find(p=>p.id===subPage?.id);let query=(document.querySelector('#librarySearch')?.value||search).toLowerCase();return `${header(mode==='admin'?'Gestão da academia':'Academia MEI','Aulas organizadas por trilhas, fases e assuntos.',mode==='admin'?button('+ Criar categoria',"openModal('category')"):'')}${subPage?`<button class="back" onclick="subPage=${phase?`{kind:'category',id:'${phase.categoryId}'}`:'null'};render()">← Voltar</button>`:''}${!subPage?`<div class="card" style="margin-bottom:18px"><div class="flex"><span style="font-size:24px">🔎</span><input class="input" id="librarySearch" placeholder="Pesquise por conteúdos, aulas ou criativos..." value="${esc(search)}" oninput="search=this.value;renderSearchResults(this.value)" style="border:0;box-shadow:none"></div><div id="searchResultBox"></div></div><div class="tabs">${['Todos','Iniciante','Intermediário','Avançado'].map(f=>`<button class="tab ${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><div class="grid three">${db.categories.filter(c=>filter==='Todos'||c.level===filter).map(c=>`<div class="resource" onclick="subPage={kind:'category',id:'${c.id}'};render()"><div class="resourceicon" style="background:${c.color};font-size:25px">${c.icon}</div>${chip(c.level)}<h2 style="margin-top:12px">${esc(c.title)}</h2><p>${esc(c.description)}</p><div class="flex" style="justify-content:space-between"><small>${db.phases.filter(p=>p.categoryId===c.id).length} fases</small><b style="color:var(--purple)">Explorar →</b></div>${mode==='admin'?`<div class="actionrow" style="margin-top:12px" onclick="event.stopPropagation()">${button('Editar',`openModal('category','${c.id}')`,'soft sm')}${button('Excluir',`deleteRecord('categories','${c.id}')`,'danger sm')}</div>`:''}</div>`).join('')}</div>`:cat?`<div class="banner" style="background:linear-gradient(110deg,#57047e,#9a49c8)"><div><div class="eyebrow">${esc(cat.level)}</div><h1>${esc(cat.title)}</h1><p>${esc(cat.description)}</p></div></div><div class="flex" style="justify-content:space-between;margin-bottom:18px"><h2>Fases da sua aprendizagem</h2>${mode==='admin'?button('+ Nova fase',`openModal('phase','${cat.id}')`):''}</div>${db.phases.filter(p=>p.categoryId===cat.id).map((p,i)=>`<div class="unit"><div class="unit-header" onclick="subPage={kind:'phase',id:'${p.id}'};render()"><div class="flex"><div class="resourceicon" style="margin:0">${String(i+1).padStart(2,'0')}</div><div><b>${esc(p.title)}</b><br><small>${db.lessons.filter(l=>l.phaseId===p.id).length} aulas e materiais</small></div></div><b>→</b></div>${mode==='admin'?`<div class="actionrow" style="margin-top:12px">${button('Editar fase',`openModal('phase','${p.id}')`,'soft sm')}${button('Excluir',`deleteRecord('phases','${p.id}')`,'danger sm')}</div>`:''}</div>`).join('')}`:phase?`<div class="card"><div class="flex" style="justify-content:space-between"><div><div class="eyebrow">CONTEÚDO DE APRENDIZAGEM</div><h1>${esc(phase.title)}</h1></div>${mode==='admin'?button('+ Nova aula',`openModal('lesson','${phase.id}')`):''}</div>${db.lessons.filter(l=>l.phaseId===phase.id).map((l,i)=>`<div class="minirow clickable" onclick="openModal('lessonDetail','${l.id}')"><div class="flex"><div class="resourceicon" style="margin:0">▶</div><div><b>${i+1}. ${esc(l.title)}</b><br><small>${esc(l.description)}</small></div></div><div class="actionrow">${l.url?button('Assistir',`window.open('${esc(l.url)}','_blank','noopener')`,'sm'):'<small>Link a cadastrar</small>'}${mode==='admin'?button('Editar',`event.stopPropagation();openModal('lesson','${l.id}')`,'soft sm'):''}</div></div>`).join('')}</div>`:''}`}
function renderSearchResults(q){let root=document.querySelector('#searchResultBox');if(!root)return;let l=db.lessons.filter(x=>(x.title+' '+x.description+' '+(db.phases.find(p=>p.id===x.phaseId)?.title||'')).toLowerCase().includes(q.toLowerCase()));root.innerHTML=q?`<div class="searchresults">${l.length?l.map(x=>`<div class="minirow"><span>▶ ${esc(x.title)}</span><button class="btn soft sm" onclick="subPage={kind:'phase',id:'${x.phaseId}'};render()">Ver aula</button></div>`).join(''):'<small>Nenhuma aula encontrada. Tente outra palavra-chave.</small>'}</div>`:''}
function promptsPage(){let cats=[...new Set(db.prompts.map(x=>x.category))];return `${header(mode==='admin'?'Gerenciar prompts':'Laboratório de prompts','Prompts prontos para aplicar no seu negócio.',mode==='admin'?button('+ Novo prompt',"openModal('prompt')"):'')}<div class="card" style="margin-bottom:18px"><input class="input" placeholder="Buscar prompt por assunto..." oninput="filterRows(this.value,'promptCard')"></div><div class="grid three">${db.prompts.map(p=>`<div class="resource promptCard" data-key="${esc((p.title+' '+p.category+' '+p.text).toLowerCase())}"><div class="resourceicon">✧</div>${chip(p.category)}<h2 style="margin-top:12px">${esc(p.title)}</h2><p>${esc(p.text.slice(0,140))}...</p><div class="actionrow">${button('Abrir prompt',`openModal('promptView','${p.id}')`,'sm')}${mode==='admin'?button('Editar',`openModal('prompt','${p.id}')`,'soft sm'):''}</div></div>`).join('')}</div>`}
function adminContracts(){return `${header('Central de contratos','Aprovar ou recusar documentos enviados pelas mentoradas.') }<div class="card"><table class="table"><thead><tr><th>Mentorada</th><th>Status</th><th>Último documento</th><th>Ações</th></tr></thead><tbody>${db.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${chip(docStatus[s.contract][0],docStatus[s.contract][1])}</td><td>${db.contractUploads[s.id]?.filename?esc(db.contractUploads[s.id].filename):'Não enviado'}</td><td>${button('Analisar / editar',`openModal('contractReview','${s.id}')`,'soft sm')} ${button('Ver como aluna',`switchMode('student','${s.id}')`,'white sm')}</td></tr>`).join('')}</tbody></table></div>`}
function renderContract(){let s=me(),up=db.contractUploads[s.id];return `${header('Meu contrato','Acompanhe o documento e libere sua jornada com segurança.')}${s.contract==='rejected'?`<div class="notice alert"><b>Seu contrato não foi aprovado.</b><br>${esc(up?.reason||'O documento enviado não foi validado. Verifique e envie novamente.')}. Seu acesso aos demais módulos ficará suspenso até a regularização.</div>`:s.contract==='review'?'<div class="notice warn"><b>Contrato recebido · aguardando validação.</b> Você já pode acessar a plataforma. Se o documento for recusado, o acesso será suspenso até o reenvio.</div>':s.contract==='approved'?'<div class="notice success">✅ Contrato validado e aprovado pela administração.</div>':'<div class="notice warn">Seu documento ainda precisa ser assinado e enviado.</div>'}<div class="grid two"><div class="card"><h2>📄 Contrato de mentoria</h2><p>Confira os dados, baixe o documento preparado pela mentora e assine pelo GOV.BR.</p><div class="actionrow">${button('Baixar contrato',`downloadContract('${s.id}')`)}${button('Assinar no GOV.BR',"window.open('https://assinador.iti.br/','_blank','noopener')",'soft')}</div><div class="spacer"></div><ol style="line-height:2;color:#62556e"><li>Baixe o PDF preparado pela mentora.</li><li>Assine o arquivo no GOV.BR.</li><li>Baixe a versão assinada sem imprimir.</li><li>Envie o PDF assinado aqui embaixo.</li></ol><div class="notice warn">Na V2, use a impressão do navegador e escolha “Salvar como PDF”. A minuta demonstrativa deve ser substituída pelo texto jurídico integral aprovado antes de qualquer uso real.</div></div><div class="card"><h2>📤 Enviar contrato assinado</h2><p>Envie o arquivo assinado em PDF. O envio libera o acesso provisório, até a avaliação da mentora.</p><input type="file" accept="application/pdf" id="signedFile" class="input"><div style="height:12px"></div>${button('Enviar para validação',`submitContract('${s.id}')`)}${up?.filename?`<div class="notice">Último envio: <b>${esc(up.filename)}</b><br><small>${esc(up.uploadedAt||'')}</small></div>`:''}</div></div>`}
function submitContract(sid){let file=document.getElementById('signedFile')?.files?.[0];if(!file){toast('Selecione um PDF para enviar.');return}if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){toast('Envie um arquivo PDF.');return}let s=getStudent(sid);db.contractUploads[sid]={filename:file.name,uploadedAt:new Date().toLocaleString('pt-BR'),reason:''};s.contract='review';s.active=true;log(sid,'contract',`Enviou o contrato “${file.name}” para validação`,sid);toast('Recebido! Acesso liberado provisoriamente.');render()}
function downloadContract(sid){let s=getStudent(sid),d=db.diagnostics[sid]||{},txt=db.settings.contractTemplate.replace(/{{nome}}/g,s.name).replace(/{{cpf}}/g,d.cpf||'A preencher').replace(/{{endereco}}/g,d.address||'A preencher').replace(/{{programa}}/g,s.program||'MEI').replace(/{{meses}}/g,s.months).replace(/{{encontros}}/g,s.meetings);let blob=new Blob([txt],{type:'text/plain;charset=utf-8'});downloadBlob(blob,'MINUTA_CONTRATO_'+s.name.replace(/\s/g,'_')+'.txt');toast('Minuta demonstrativa exportada. Substitua pelo contrato jurídico aprovado.')}function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function renderDiagnosis(required){let s=me(),d=db.diagnostics[s.id]||{};return `${header('Diagnóstico estratégico','Preencha uma vez: as informações abastecerão seu perfil e o CRM.')}${required?'<div class="notice warn">Antes de acessar os módulos, complete seu cadastro e diagnóstico inicial.</div>':''}<div class="card onboarding"><div class="eyebrow">DADOS E OBJETIVOS</div><h2>Seu ponto de partida</h2><p>Seus dados serão usados para organizar sua jornada e preparar o contrato.</p><form onsubmit="event.preventDefault();saveDiagnosis()"><div class="form-section"><h3>01 · Identificação e contato</h3><div class="fields">${field('Nome completo','dn',s.name)}${field('Data de nascimento','dbirth',s.birthday||'', 'date')}${field('CPF','dcpf',d.cpf||'')}${field('RG','drg',d.rg||'')}${field('WhatsApp com DDD','dphone',s.phone||'','tel')}${field('E-mail','demail',s.email||'','email')}</div></div><div class="form-section"><h3>02 · Endereço completo</h3><div class="fields">${field('CEP (Brasil)','dcep',d.cep||'','text','00000-000')}${field('País','dcountry',d.country||'Brasil')}${field('Rua / Avenida','dstreet',d.street||'')}${field('Número','dnumber',d.number||'')}${field('Bairro','dneighborhood',d.neighborhood||'')}${field('Complemento','dextra',d.extra||'')}${field('Cidade','dcity',d.city||'')}${field('Estado / Região','dstate',d.state||'')}</div><p class="help">Ao sair do campo CEP, a plataforma consulta o ViaCEP quando disponível. É possível editar todos os campos manualmente.</p></div><div class="form-section"><h3>03 · Sobre seu negócio</h3><div class="fields">${field('Nome da marca','dbrand',d.brand||'')}${field('Nicho de atuação','dniche',d.niche||s.profile?.niche||'')}${field('Produto ou serviço principal','dproduct',d.product||'')}${field('Perfil Instagram','dinstagram',d.instagram||'')}</div></div><div class="form-section"><h3>04 · Diagnóstico e metas</h3><div class="fields">${field('Faturamento mensal atual (R$)','drevenue',d.revenue||s.profile?.revenue||'','number')}${field('Seguidores atuais','dfollowers',d.followers||s.profile?.followers||'','number')}${field('Sua principal meta','dgoal',d.goal||s.profile?.goal||'')}${field('Nota para sua organização (0 a 10)','dscore',d.score||'','number')}</div><div style="height:12px"></div>${textarea('Quais suas principais dificuldades?','ddifficulties',d.difficulties||'')}<div style="height:12px"></div>${textarea('O que você já tentou e funcionou?','dworked',d.worked||'')}<div style="height:12px"></div>${textarea('O que você espera da mentoria?','dexpectations',d.expectations||'')}</div><div style="height:20px"></div><button class="btn" type="submit">Salvar diagnóstico e continuar →</button></form></div>`}
async function fetchCep(){let c=val('dcep').replace(/\D/g,'');if(c.length!==8)return;try{let r=await fetch('https://viacep.com.br/ws/'+c+'/json/');let j=await r.json();if(j.erro)return;for(let [id,k] of [['dstreet','logradouro'],['dneighborhood','bairro'],['dcity','localidade'],['dstate','uf']]){let e=document.getElementById(id);if(e&&!e.value)e.value=j[k]||''}toast('CEP encontrado. Confira e complete os dados.')}catch{toast('CEP indisponível no momento. Preencha manualmente.')}}document.addEventListener('focusout',e=>{if(e.target?.id==='dcep')fetchCep()});function saveDiagnosis(){let s=me(),d={};['cpf','rg','cep','country','street','number','neighborhood','extra','city','state','brand','niche','product','instagram','revenue','followers','goal','score','difficulties','worked','expectations'].forEach(k=>d[k]=val('d'+k));d.address=[d.street,d.number,d.extra,d.neighborhood,d.city,d.state,d.country].filter(Boolean).join(', ');s.name=val('dn')||s.name;s.email=val('demail')||s.email;s.phone=val('dphone');s.birthday=val('dbirth');s.diagnostic=true;s.profile={niche:d.niche,goal:d.goal,revenue:Number(d.revenue)||0,followers:Number(d.followers)||0};db.diagnostics[s.id]=d;log(s.id,'diagnostic','Preencheu ou atualizou o diagnóstico estratégico',s.id);page='contract';toast('Diagnóstico salvo! Agora confira seu contrato.');render()}
function meetingsPage(){let s=me();return `${header(mode==='admin'?'Mentorias e gravações':'Meus encontros','Agendamento pelo Google Calendar e gravações por link.',mode==='admin'?button('+ Adicionar encontro',"openModal('meeting')"):'')}${db.settings.calendarUrl?`<div class="notice">Agenda de horários: ${button('Abrir Google Calendar',`window.open('${esc(db.settings.calendarUrl)}','_blank','noopener')`,'sm')}</div>`:'<div class="notice warn">O link de agendamento ainda não foi cadastrado pela mentora.</div>'}<div class="grid two">${db.meetings.filter(m=>m.studentId===s.id).map(m=>`<div class="card"><div class="eyebrow">${fmt(m.date)}</div><h2>${esc(m.title)}</h2><p>${esc(m.notes||'')}</p><div class="actionrow">${m.recording?button('▶ Ver gravação',`window.open('${esc(m.recording)}','_blank','noopener')`):chip('Gravação pendente','yellow')}${mode==='admin'?button('Editar',`openModal('meeting','${m.id}')`,'soft'):''}</div></div>`).join('')}</div>${mode==='admin'?`<div class="notice">${db.meetings.filter(m=>!m.recording).length} encontro(s) sem gravação. Esses registros aparecem também na sua fila administrativa.</div>`:''}`}
function calendarPage(){let now=new Date(),yr=now.getFullYear(),mo=now.getMonth(),first=(new Date(yr,mo,1).getDay()+6)%7,days=new Date(yr,mo+1,0).getDate();let cells=Array.from({length:first},()=>'<div></div>').concat(Array.from({length:days},(_,i)=>{let d=i+1,date=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,birth=db.students.filter(s=>s.birthday?.slice(5)===date.slice(5)),due=db.tasks.filter(t=>t.due===date&& (mode==='admin'||db.boards.some(b=>b.studentId===studentId&&b.id===t.boardId))),meet=db.meetings.filter(m=>m.date===date&&(mode==='admin'||m.studentId===studentId));return `<div class="calday"><strong>${d}</strong>${birth.map(s=>`<span class="calitem bday">🎂 ${esc(s.name.split(' ')[0])}</span>`).join('')}${due.slice(0,2).map(t=>`<span class="calitem">📋 ${esc(t.title.slice(0,13))}</span>`).join('')}${meet.map(m=>`<span class="calitem">📞 Encontro</span>`).join('')}</div>`}));return `${header(mode==='admin'?'Calendário geral':'Minha agenda','Aniversários, encontros, vencimentos e datas importantes.') }<div class="card"><div class="flex" style="justify-content:space-between"><h2>${now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2>${chip('Calendário do mês atual')}</div><div class="calgrid" style="margin:15px 0 8px">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(w=>`<small style="text-align:center">${w}</small>`).join('')}</div><div class="calgrid">${cells.join('')}</div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>🎂 Aniversários cadastrados</h2>${db.students.filter(s=>s.birthday).sort((a,b)=>a.birthday.slice(5).localeCompare(b.birthday.slice(5))).map(s=>`<div class="minirow"><b>${esc(s.name)}</b><small>${s.birthday.slice(5).split('-').reverse().join('/')}</small></div>`).join('')}</div><div class="card"><h2>Próximos passos</h2><p>Datas de tarefas e encontros ficam vinculadas aos seus respectivos registros. O calendário está em modo demonstrativo.</p>${mode==='admin'?button('Cadastrar encontro',"openModal('meeting')") :''}</div></div>`}
function notificationsPage(){let items=mode==='admin'?db.activity:db.notifications.filter(n=>n.studentId===studentId);return `${header(mode==='admin'?'Central de atividades':'Minhas notificações','Registros da jornada, avisos e interações.',mode==='admin'?button('+ Publicar aviso',"openModal('notice')") :button('Marcar como lidas',"markRead()",'soft'))}${mode==='admin'?`<div class="card">${activityList(items)}</div>`:`<div class="card">${items.map(n=>`<div class="minirow"><div><b>${n.read?'':'● '}${esc(n.text)}</b><br><small>${new Date(n.at).toLocaleString('pt-BR')}</small></div>${n.read?'':chip('Novo')}</div>`).join('')||'<div class="empty">Nenhuma notificação por enquanto.</div>'}</div>`}`}

function settingsPage(){return `${header('Configurações gerais','Tudo editável no painel da mentora.') }<div class="card"><h2>Links e mensagens</h2><div class="fields">${field('Link de agendamento do Google Calendar','scalendar',db.settings.calendarUrl,'url')}${field('Link geral da academia','sacademy',db.settings.academyUrl,'url')}</div><div class="spacer"></div>${textarea('Modelo de WhatsApp (use {{nome}} e {{assunto}})','swa',db.settings.whatsappTemplate)}<div class="spacer"></div>${textarea('Mensagem de aniversário (use {{nome}})','sbday',db.settings.birthdayMessage)}<div class="spacer"></div>${textarea('Minuta do contrato (campos: {{nome}}, {{cpf}}, {{endereco}}, {{programa}}, {{meses}}, {{encontros}})','scontract',db.settings.contractTemplate)}<div class="spacer"></div><div class="actionrow">${button('Salvar configurações',"saveSettings()")}${button('Exportar dados demonstrativos',"exportDemo()",'soft')}${button('Reiniciar demonstração',"resetDemo()",'danger')}</div></div><div class="notice warn"><b>Aviso importante:</b> Este é um protótipo local sem autenticação real, banco multiusuário, notificações remotas ou validação criptográfica de assinatura. Não publique com informações reais de CPF/RG ou contratos até conectar backend, acesso seguro e armazenamento apropriado.</div>`}
function saveSettings(){Object.assign(db.settings,{calendarUrl:val('scalendar'),academyUrl:val('sacademy'),whatsappTemplate:val('swa'),birthdayMessage:val('sbday'),contractTemplate:val('scontract')});save();toast('Configurações salvas no navegador.')}function exportDemo(){downloadBlob(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'mei_demonstracao.json')}function resetDemo(){if(confirm('Deseja apagar os dados locais e restaurar a demonstração?')){db=seed();save();render()}}
function renderModalLegacy(){let s=me(),p=modalPayload,rec;let title='',content='',width='';if(modal==='student'){rec=db.students.find(x=>x.id===p);title=rec?'Editar mentorada':'Cadastrar mentorada';content=`<div class="fields">${field('Nome completo','mname',rec?.name||'')}${field('E-mail de acesso','memail',rec?.email||'','email')}${field('WhatsApp (DDD + telefone)','mphone',rec?.phone||'','tel')}${selectField('Programa','mprogram',[['MEI','Mentoria MEI'],['45D','Aceleração 45D'],['VIP','Mentoria VIP'],['Outro','Outro']],rec?.program||'MEI')}${selectField('Duração (meses)','mmonths',Array.from({length:12},(_,i)=>[i+1,`${i+1} ${i?'meses':'mês'}`]),rec?.months||6)}${field('Quantidade de encontros','mmeetings',rec?.meetings||7,'number')}${field('Data de ingresso','mjoined',rec?.joined||dateISO(),'date')}${field('Data da primeira call','mfirst',rec?.firstCall||'','date')}${field('Aniversário','mbirth',rec?.birthday||'','date')}</div><div class="notice warn">A vigência operacional será calculada a partir da data da primeira call, respeitando as condições contratuais. A senha do protótipo é apenas ilustrativa; não há login real aqui.</div><div class="actionrow">${button('Salvar mentorada',`saveStudent('${p||''}')`)}${rec?`${button('Ver como aluna',`closeModal();switchMode('student','${rec.id}')`,'soft')}${button('Redefinir acesso',`resetStudentAccess('${rec.id}')`,'white')}${button(rec.active?'Suspender acesso':'Reativar acesso',`toggleAccess('${rec.id}')`,'danger')}${button('Arquivar / excluir',`deleteStudent('${rec.id}')`,'danger')}`:''}</div>`}
else if(modal==='model'){rec=db.models.find(x=>x.id===p);title=rec?'Editar modelo Kanban':'Novo modelo de plano';content=`<div class="fields">${field('Nome do modelo','mtitle',rec?.title||'')}${field('Cor do modelo','mcolor',rec?.color||'#660692','color')}</div><div class="spacer"></div>${textarea('Descrição','mdesc',rec?.description||'')}<div class="spacer"></div>${textarea('Tarefas (uma por linha)','mtasks',(rec?.tasks||[]).map(t=>t.title).join('\n'))}<p class="help">Ao salvar, cada linha vira uma tarefa base. Você poderá personalizar as tarefas após atribuir o plano.</p>${button('Salvar modelo',`saveModel('${p||''}')`)}`}
else if(modal==='assign'){rec=db.models.find(x=>x.id===p);title='Atribuir plano à mentorada';content=`<p>Modelo selecionado: <b>${esc(rec?.title)}</b></p><div class="fields">${selectField('Mentorada','aStudent',db.students.map(s=>[s.id,s.name]),studentId)}${field('Nome do novo quadro','aTitle',rec?.title||'')}${selectField('Prazos automáticos','aDeadline',[['model','Usar os dias do modelo'],['3','Todas em 3 dias'],['7','Todas em 7 dias'],['15','Todas em 15 dias']], 'model')}</div><div class="spacer"></div>${button('Criar e notificar mentorada',`assignModel('${p}')`)}`}
else if(modal==='board'){rec=db.boards.find(x=>x.id===p);title=rec?'Editar quadro':'Novo plano de ação';content=`<div class="fields">${selectField('Mentorada','bStudent',db.students.map(s=>[s.id,s.name]),rec?.studentId||studentId)}${field('Nome do Kanban','bTitle',rec?.title||'')}${field('Cor do quadro','bColor',rec?.color||'#660692','color')}</div><div class="spacer"></div>${textarea('Objetivo do plano','bDesc',rec?.description||'')}<div class="spacer"></div><div class="actionrow">${button('Salvar quadro',`saveBoard('${p||''}')`)}${rec?button('Excluir quadro',`deleteRecord('boards','${rec.id}')`,'danger'):''}</div>`}
else if(modal==='task'||modal==='taskNew'){rec=db.tasks.find(x=>x.id===p);let boardId=rec?.boardId||(modal==='taskNew'?p:selectedBoard);title=rec?'Editar tarefa e acompanhar':'Nova tarefa no Kanban';content=`<div class="fields">${field('Título da tarefa','tTitle',rec?.title||'')}${selectField('Coluna / status','tStatus',statuses.map(x=>[x[0],x[1]]),rec?.status||'todo')}${selectField('Cor e prioridade','tPriority',[['red','🔴 Urgente'],['orange','🟠 Atenção'],['purple','🟣 Estratégico'],['green','🟢 Vendas / livre'],['blue','🔵 Informativo']],rec?.priority||'purple')}${selectField('Prazo rápido','tQuick',[['','Escolher data do calendário'],['3','3 dias a partir de hoje'],['7','7 dias a partir de hoje'],['15','15 dias a partir de hoje']], '')}${field('Data da entrega','tDue',rec?.due||plusDays(7),'date')}${field('Link de apoio / entrega','tLink',rec?.links?.[0]||'','url')}</div><div class="spacer"></div>${textarea('Descrição e orientações','tDesc',rec?.description||'')}<div class="spacer"></div>${textarea('Checklist (um item por linha)','tChecklist',(rec?.checklist||[]).join('\n'))}<div class="spacer"></div><div class="actionrow">${button('Salvar tarefa',`saveTask('${rec?.id||''}','${boardId}')`)}${rec?`${button('Excluir',`deleteRecord('tasks','${rec.id}')`,'danger')}${button('Concluir agora',`completeTask('${rec.id}')`,'green')}`:''}</div>${rec?`<hr style="border:0;border-top:1px solid #eee4f2;margin:20px 0"><h3>Comentários e histórico</h3>${(rec.comments||[]).map(c=>`<div class="notice"><b>${esc(c.by)}</b> · ${esc(c.at)}<br>${esc(c.text)}</div>`).join('')||'<p>Sem comentários por enquanto.</p>'}${textarea('Adicionar comentário','tComment','')}<div class="spacer"></div>${button('Enviar comentário',`commentTask('${rec.id}')`,'soft')}`:''}`}
else if(modal==='category'){rec=db.categories.find(x=>x.id===p);title=rec?'Editar categoria':'Adicionar categoria';content=`<div class="fields">${field('Nome da categoria','cTitle',rec?.title||'')}${field('Emoji da categoria','cIcon',rec?.icon||'📚')}${selectField('Nível','cLevel',[['Iniciante','Iniciante'],['Intermediário','Intermediário'],['Avançado','Avançado']],rec?.level||'Iniciante')}${field('Cor de destaque','cColor',rec?.color||'#f4e8fb','color')}</div><div class="spacer"></div>${textarea('Descrição','cDesc',rec?.description||'')}<div class="spacer"></div>${button('Salvar categoria',`saveCategory('${p||''}')`)}`}
else if(modal==='phase'){rec=db.phases.find(x=>x.id===p);title=rec?'Editar fase':'Adicionar fase';let catId=rec?.categoryId||p;content=`${field('Nome da fase','pTitle',rec?.title||'')}<div class="spacer"></div>${selectField('Categoria','pCategory',db.categories.map(c=>[c.id,c.title]),catId)}<div class="spacer"></div>${button('Salvar fase',`savePhase('${rec?.id||''}')`)}`}
else if(modal==='lesson'){rec=db.lessons.find(x=>x.id===p);title=rec?'Editar aula':'Adicionar aula';content=`${field('Título da aula','lTitle',rec?.title||'')}<div class="spacer"></div>${selectField('Fase','lPhase',db.phases.map(x=>[x.id,x.title]),rec?.phaseId||p)}<div class="spacer"></div>${field('Link da aula na academia','lUrl',rec?.url||'','url')}<div class="spacer"></div>${textarea('Descrição / passo a passo','lDesc',rec?.description||'')}<div class="spacer"></div><div class="actionrow">${button('Salvar aula',`saveLesson('${rec?.id||''}')`)}${rec?button('Excluir',`deleteRecord('lessons','${rec.id}')`,'danger'):''}</div>`}
else if(modal==='prompt'){rec=db.prompts.find(x=>x.id===p);title=rec?'Editar prompt':'Novo prompt';content=`${field('Título','prTitle',rec?.title||'')}<div class="spacer"></div>${field('Categoria','prCategory',rec?.category||'Conteúdo')}<div class="spacer"></div>${textarea('Texto completo do prompt','prText',rec?.text||'')}<div class="spacer"></div><div class="actionrow">${button('Salvar prompt',`savePrompt('${rec?.id||''}')`)}${rec?button('Excluir',`deleteRecord('prompts','${rec.id}')`,'danger'):''}</div>`}
else if(modal==='promptView'){rec=db.prompts.find(x=>x.id===p);title=rec?.title||'Prompt';content=`${chip(rec?.category||'Geral')}<div class="notice" style="white-space:pre-wrap;line-height:1.8">${esc(rec?.text||'')}</div>${button('Copiar prompt',`copyPromptById('${rec?.id||''}')`)}`}
else if(modal==='contractReview'){rec=getStudent(p);title='Analisar contrato · '+rec?.name;let up=db.contractUploads[p];content=`<div class="notice">Status atual: ${chip(docStatus[rec.contract][0],docStatus[rec.contract][1])}<br><br>Arquivo declarado: <b>${esc(up?.filename||'Não enviado')}</b><br><small>Observação: na demonstração, o arquivo não é armazenado nem validado. Não aprove documentos fictícios como se fossem documentos reais.</small></div>${textarea('Motivo da recusa ou observação','crReason',up?.reason||'')}<div class="spacer"></div><div class="actionrow">${button('✓ Aprovar contrato',`updateContract('${p}','approved')`,'green')}${button('✕ Recusar e suspender',`updateContract('${p}','rejected')`,'danger')}${button('Marcar aguardando validação',`updateContract('${p}','review')`,'soft')}</div>`}
else if(modal==='meeting'){rec=db.meetings.find(x=>x.id===p);title=rec?'Editar encontro':'Registrar encontro';content=`<div class="fields">${selectField('Mentorada','meetStudent',db.students.map(s=>[s.id,s.name]),rec?.studentId||studentId)}${field('Data','meetDate',rec?.date||dateISO(),'date')}${field('Título','meetTitle',rec?.title||'Encontro de mentoria')}${field('Link da gravação (Google Drive)','meetLink',rec?.recording||'','url')}</div><div class="spacer"></div>${textarea('Resumo e orientações','meetNotes',rec?.notes||'')}<div class="spacer"></div>${button('Salvar encontro',`saveMeeting('${rec?.id||''}')`)}`}
else if(modal==='notice'){title='Publicar comunicado';content=`${field('Título do aviso','noTitle','')}<div class="spacer"></div>${selectField('Destinatários','noScope',[['all','Todas as mentoradas'],...db.students.map(s=>[s.id,s.name])],'all')}<div class="spacer"></div>${textarea('Mensagem','noBody','')}<div class="spacer"></div>${button('Publicar e notificar',`saveNotice()`)}`}
else if(modal==='support'){rec=db.support.find(x=>x.id===p);title=rec?'Solicitação de suporte':'Abrir suporte';content=`${field('Assunto','suTitle',rec?.title||'')}<div class="spacer"></div>${textarea('Descrição da solicitação','suBody',rec?.body||'')}<div class="spacer"></div>${selectField('Status','suStatus',[['Aberto','Aberto'],['Em análise','Em análise'],['Concluído','Concluído']],rec?.status||'Aberto')}<div class="spacer"></div>${button('Salvar solicitação',`saveSupport('${rec?.id||''}')`)}`}
else if(modal==='result'){title='Registrar resultados';content=`<div class="fields">${field('Mês','reMonth',dateISO().slice(0,7),'month')}${field('Faturamento (R$)','reRevenue','','number')}${field('Despesas / investimento','reExpense','','number')}${field('Quantidade de vendas','reSales','','number')}${field('Seguidores','reFollowers','','number')}</div><div class="spacer"></div>${button('Salvar resultados',`saveResult()`)}`}
else if(modal==='project'){rec=db.projects.find(x=>x.id===p);title=rec?'Editar projeto':'Novo projeto';content=`${field('Nome','pjTitle',rec?.title||'')}<div class="spacer"></div>${selectField('Tipo','pjType',[['Infoproduto','Infoproduto'],['Serviço','Serviço'],['Página de vendas','Página de vendas'],['Campanha','Campanha'],['Funil','Funil']],rec?.type||'Infoproduto')}<div class="spacer"></div>${field('Status','pjStatus',rec?.status||'Em desenvolvimento')}<div class="spacer"></div>${field('Link','pjUrl',rec?.url||'','url')}<div class="spacer"></div>${button('Salvar projeto',`saveProject('${rec?.id||''}')`)}`}
else if(modal==='points'){title='Lançar pontos · Embaixadora Black';content=`${selectField('Mentorada','ptStudent',db.students.map(s=>[s.id,s.name]),studentId)}<div class="spacer"></div>${field('Pontos','ptValue','50','number')}<div class="spacer"></div>${field('Motivo','ptReason','Indicação confirmada')}<div class="spacer"></div>${button('Registrar pontos',`savePoints()`)}`}
return `<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal ${width}"><div class="modalhead"><div><div class="eyebrow">CENTRAL MAGNÉTICA</div><h2>${esc(title)}</h2></div><button class="close" onclick="closeModal()">×</button></div>${content}</div></div>`}
function openModal(name,p=null){modal=name;modalPayload=p;render()}function closeModal(){modal='';modalPayload=null;render()}
function saveStudent(id){if(!val('mname')||!val('memail')){toast('Nome e e-mail são obrigatórios.');return}let rec=db.students.find(x=>x.id===id),months=Number(val('mmonths')),auto={3:4,6:7,12:14};let payload={name:val('mname'),email:val('memail'),phone:val('mphone'),program:val('mprogram'),months,meetings:Number(val('mmeetings'))||auto[months]||months,joined:val('mjoined'),firstCall:val('mfirst'),birthday:val('mbirth')};if(rec)Object.assign(rec,payload);else{rec={id:uid(),...payload,contract:'pending',diagnostic:false,active:true,profile:{}};db.students.push(rec)}studentId=rec.id;log('admin','student',(id?'Atualizou':'Cadastrou')+' a mentorada '+rec.name,rec.id);closeModal();toast('Cadastro salvo.')}function toggleAccess(id){let s=getStudent(id);s.active=!s.active;log('admin','access',`${s.active?'Reativou':'Suspendeu'} o acesso de ${s.name}`,id);closeModal()}function resetStudentAccess(id){log('admin','password','Solicitou redefinição de acesso (simulação)',id);toast('Simulação: no Supabase será enviado um convite de redefinição seguro.')}function deleteStudent(id){if(confirm('Excluir a mentorada e os dados de demonstração relacionados?')){db.students=db.students.filter(x=>x.id!==id);db.boards=db.boards.filter(x=>x.studentId!==id);db.notifications=db.notifications.filter(x=>x.studentId!==id);studentId=db.students[0]?.id||'';log('admin','student','Excluiu uma mentorada de demonstração');closeModal()}}
function saveModel(id){if(!val('mtitle'))return toast('Preencha o nome.');let tasks=val('mtasks').split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({title,status:'todo',priority:'purple',days:7,description:''}));let rec=db.models.find(m=>m.id===id);if(rec)Object.assign(rec,{title:val('mtitle'),description:val('mdesc'),color:val('mcolor'),tasks});else db.models.push({id:uid(),title:val('mtitle'),description:val('mdesc'),color:val('mcolor'),tasks});log('admin','model','Salvou modelo '+val('mtitle'));closeModal()}
function assignModel(id){let m=db.models.find(x=>x.id===id),sid=val('aStudent'),name=val('aTitle');if(!m||!name)return;let b={id:uid(),studentId:sid,title:name,color:m.color,description:m.description};db.boards.push(b);m.tasks.forEach(t=>db.tasks.push({id:uid(),boardId:b.id,title:t.title,status:t.status||'todo',priority:t.priority||'purple',due:plusDays(val('aDeadline')==='model'?(t.days||7):Number(val('aDeadline'))),description:t.description||'',checklist:[],comments:[],links:[]}));studentId=sid;selectedBoard=b.id;log('admin','board',`Novo plano de ação “${b.title}” com ${m.tasks.length} tarefas`,sid);page='boards';subPage=null;closeModal();toast('Plano aplicado e mentorada notificada na plataforma.')}function saveBoard(id){if(!val('bTitle'))return toast('Preencha o nome do plano.');let b=db.boards.find(x=>x.id===id);if(b)Object.assign(b,{title:val('bTitle'),description:val('bDesc'),color:val('bColor'),studentId:val('bStudent')});else{b={id:uid(),title:val('bTitle'),description:val('bDesc'),color:val('bColor'),studentId:val('bStudent')};db.boards.push(b)}studentId=b.studentId;selectedBoard=b.id;log('admin','board','Criou / atualizou plano '+b.title,b.studentId);closeModal()}
function saveTask(id,boardId){if(!val('tTitle'))return toast('Informe o título.');let t=db.tasks.find(x=>x.id===id),deadline=val('tQuick')?plusDays(Number(val('tQuick'))):val('tDue'),data={title:val('tTitle'),status:val('tStatus'),priority:val('tPriority'),due:deadline,description:val('tDesc'),checklist:val('tChecklist').split('\n').map(x=>x.trim()).filter(Boolean),links:val('tLink')?[val('tLink')]:[]};if(t)Object.assign(t,data);else{t={id:uid(),boardId,...data,comments:[]};db.tasks.push(t)}let sid=db.boards.find(b=>b.id===boardId)?.studentId;log(mode==='admin'?'admin':sid,'task',`${mode==='admin'?'A mentora':'A mentorada'} ${id?'atualizou':'criou'} tarefa “${t.title}”`,sid);closeModal()}function completeTask(id){let t=db.tasks.find(x=>x.id===id);t.status='done';log(mode==='admin'?'admin':studentId,'task',`Concluiu a tarefa “${t.title}”`,db.boards.find(b=>b.id===t.boardId)?.studentId);closeModal()}function commentTask(id){if(!val('tComment'))return;let t=db.tasks.find(x=>x.id===id);t.comments=t.comments||[];t.comments.push({by:mode==='admin'?'Waleska':me().name,text:val('tComment'),at:new Date().toLocaleString('pt-BR')});log(mode==='admin'?'admin':studentId,'comment',`Comentou a tarefa “${t.title}”`,db.boards.find(b=>b.id===t.boardId)?.studentId);openModal('task',id)}
function saveCategory(id){if(!val('cTitle'))return;let c=db.categories.find(x=>x.id===id),data={title:val('cTitle'),icon:val('cIcon'),level:val('cLevel'),color:val('cColor'),description:val('cDesc')};if(c)Object.assign(c,data);else db.categories.push({id:uid(),...data});log('admin','library','Atualizou categoria '+val('cTitle'));closeModal()}function savePhase(id){if(!val('pTitle'))return;let p=db.phases.find(x=>x.id===id),data={title:val('pTitle'),categoryId:val('pCategory')};if(p)Object.assign(p,data);else db.phases.push({id:uid(),...data});log('admin','library','Salvou fase '+val('pTitle'));closeModal()}function saveLesson(id){if(!val('lTitle'))return;let l=db.lessons.find(x=>x.id===id),data={title:val('lTitle'),phaseId:val('lPhase'),url:val('lUrl'),description:val('lDesc')};if(l)Object.assign(l,data);else db.lessons.push({id:uid(),...data});db.students.forEach(s=>notify(s.id,'Nova aula ou material disponível: '+data.title));log('admin','library','Publicou / editou aula '+data.title);closeModal()}function savePrompt(id){if(!val('prTitle'))return;let p=db.prompts.find(x=>x.id===id),data={title:val('prTitle'),category:val('prCategory'),text:val('prText')};if(p)Object.assign(p,data);else db.prompts.push({id:uid(),...data});log('admin','prompt','Salvou prompt '+val('prTitle'));closeModal()}function copyPromptById(id){copyValue(db.prompts.find(p=>p.id===id)?.text||'')}function copyValue(v){navigator.clipboard?.writeText(v).then(()=>toast('Copiado!')).catch(()=>toast('Use a seleção manual para copiar.'))}
function updateContract(id,status){let s=getStudent(id);s.contract=status;s.active=status!=='rejected';let u=db.contractUploads[id]||{};u.reason=val('crReason');db.contractUploads[id]=u;log('admin','contract',status==='rejected'?`Contrato recusado: ${u.reason||'Necessário reenviar'}`:status==='approved'?'Contrato aprovado; acesso confirmado':'Contrato recebido; acesso provisório liberado',id);closeModal();toast(status==='rejected'?'Contrato recusado e acesso suspenso.': 'Status contratual atualizado.')}function saveMeeting(id){let m=db.meetings.find(x=>x.id===id),data={studentId:val('meetStudent'),date:val('meetDate'),title:val('meetTitle'),recording:val('meetLink'),notes:val('meetNotes')};if(m)Object.assign(m,data);else{m={id:uid(),...data};db.meetings.push(m)}let s=getStudent(data.studentId);if(!s.firstCall)s.firstCall=data.date;log('admin','meeting','Atualizou encontro '+data.title,data.studentId);closeModal()}function saveNotice(){if(!val('noTitle'))return;let scope=val('noScope'),n={id:uid(),title:val('noTitle'),body:val('noBody'),scope,date:dateISO()};db.notices.unshift(n);db.students.filter(s=>scope==='all'||scope===s.id).forEach(s=>notify(s.id,`Novo aviso: ${n.title}`));log('admin','notice','Publicou comunicado '+n.title);closeModal()}
function saveSupport(id){if(!val('suTitle'))return;let r=db.support.find(x=>x.id===id),data={title:val('suTitle'),body:val('suBody'),status:val('suStatus')};if(r)Object.assign(r,data);else db.support.push({id:uid(),studentId:studentId,date:dateISO(),...data});log(mode==='admin'?'admin':studentId,'support','Atualizou uma solicitação de suporte',r?.studentId||studentId);closeModal()}function saveResult(){db.results.push({id:uid(),studentId:studentId,month:val('reMonth'),revenue:Number(val('reRevenue')),expense:Number(val('reExpense')),sales:Number(val('reSales')),followers:Number(val('reFollowers'))});log(mode==='admin'?'admin':studentId,'result','Registrou novos resultados financeiros e de redes',studentId);closeModal()}function saveProject(id){let r=db.projects.find(x=>x.id===id),data={title:val('pjTitle'),type:val('pjType'),status:val('pjStatus'),url:val('pjUrl')};if(r)Object.assign(r,data);else db.projects.push({id:uid(),studentId,...data});log(mode==='admin'?'admin':studentId,'project','Atualizou projeto '+data.title,studentId);closeModal()}function savePoints(){let id=val('ptStudent');db.points.push({studentId:id,value:Number(val('ptValue')),reason:val('ptReason'),date:dateISO()});log('admin','points','Lançou pontos de Embaixadora Black',id);closeModal()}

function createBlankModel(){let m={id:uid(),title:'Novo plano de ação',description:'Personalize as tarefas e a jornada',color:'#660692',tasks:[]};db.models.push(m);v2Model=m.id;modal='';save();render()}
function saveModelTask(id,i){let m=db.models.find(x=>x.id===id),t={title:val('mtTitle'),status:val('mtStatus'),priority:val('mtPriority'),days:Number(val('mtDays'))||7,description:val('mtDescription')};if(!t.title)return toast('Digite o título.');if(i<0)m.tasks.push(t);else m.tasks[i]=t;save();closeModal()}

function saveModelMeta(id){let m=db.models.find(x=>x.id===id);m.title=val('metaName');m.description=val('metaDesc');m.color=val('metaColor');save();closeModal()}

function saveProjectV2(id){let r=db.projects.find(x=>x.id===id),data={title:val('pjTitle'),type:val('pjType'),status:val('pjStatus'),url:val('pjUrl'),promise:val('pjPromise'),audience:val('pjAudience'),price:val('pjPrice'),description:val('pjDesc'),competitors:val('pjCompetitors').split('\n').filter(Boolean).slice(0,10),references:val('pjReferences').split('\n').filter(Boolean),content:val('pjContent').split('\n').filter(Boolean)};if(r)Object.assign(r,data);else db.projects.push({id:uid(),studentId,...data});log(mode==='admin'?'admin':studentId,'project','Atualizou projeto '+data.title,studentId);closeModal()}
function financePage(){let rs=db.results.filter(x=>x.studentId===studentId).slice().sort((a,b)=>(b.date||b.month).localeCompare(a.date||a.month));let total=k=>rs.reduce((a,r)=>a+Number(r[k]||0),0);let month=rs.filter(x=>(x.date||x.month).slice(0,7)===dateISO().slice(0,7));return `${header(mode==='admin'?'Financeiro e crescimento':'Meu financeiro e crescimento','Registre diariamente vendas e indicadores e acompanhe o consolidado mensal.',button('+ Registrar resultado',"openModal('result')"))}<div class="tabs">${[['dashboard','📊 Dashboard'],['finance','💰 Financeiro'],['social','📈 Redes sociais']].map(a=>`<button class="tab ${financeTab===a[0]?'active':''}" onclick="financeTab='${a[0]}';render()">${a[1]}</button>`).join('')}</div><div class="grid">${metric('💰','Receita registrada',money(total('revenue')))}${metric('🧾','Despesas registradas',money(total('expense')))}${metric('🛍️','Vendas',total('sales'))}${metric('📈','Seguidores (último registro)',rs[0]?.followers||0)}</div>${financeTab==='dashboard'?`<div class="card" style="margin-top:20px"><h2>Visão geral da jornada</h2><div class="chart-bars">${rs.slice().reverse().slice(-12).map(r=>`<div class="chart-column"><div class="bar" style="height:${Math.max(6,Math.round(Number(r.revenue||0)/Math.max(1,...rs.map(x=>Number(x.revenue)||0))*155))}px"></div><small>${esc((r.date||r.month).slice(5))}</small></div>`).join('')}</div><p>Gráfico ilustrativo calculado com os registros manuais, sem conexão bancária.</p></div>`:financeTab==='finance'?`<div class="grid three" style="margin-top:20px">${metric('🧲','Vendas order bump',total('bumpSales'))}${metric('⬆️','Vendas upsell',total('upsellSales'))}${metric('💸','Tráfego pago',money(total('ads')))}</div>`:`<div class="card" style="margin-top:20px"><h2>Redes sociais</h2><p>Registre seguidores diariamente e compare a evolução dos seus canais.</p>${rs.slice(0,15).map(r=>`<div class="minirow"><span>${fmt(r.date||r.month+'-01')}</span><b>${r.followers||0} seguidores</b></div>`).join('')}</div>`}<div class="card" style="margin-top:18px"><h2>Histórico diário e mensal</h2><div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Receita</th><th>Despesas</th><th>Vendas</th><th>Order bump</th><th>Upsell</th><th>Seguidores</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${fmt(r.date||r.month+'-01')}</td><td>${money(r.revenue)}</td><td>${money(r.expense)}</td><td>${r.sales||0}</td><td>${r.bumpSales||0} · ${money(r.bumpRevenue)}</td><td>${r.upsellSales||0} · ${money(r.upsellRevenue)}</td><td>${r.followers||0}</td></tr>`).join('')}</tbody></table></div></div>`}

function meetingsPage(){let s=me(),ms=db.meetings.filter(m=>mode==='admin'||m.studentId===s.id);return `${header(mode==='admin'?'Encontros e gravações':'Mentorias e gravações','Agende sua call e acompanhe os links de gravações e os próximos encontros.',mode==='admin'?button('+ Registrar encontro',"openModal('meeting')"):'')}${db.settings.calendarUrl?`<div class="banner"><div><h2>Agende sua próxima mentoria</h2><p>Escolha o horário disponível diretamente na agenda oficial da mentora.</p>${button('📅 Abrir horários disponíveis',`window.open('${esc(db.settings.calendarUrl)}','_blank','noopener')`,'white')}</div></div>`:`<div class="notice warn">A administração deve cadastrar o link da página de agendamento em Configurações. O link do Google Meet isolado não oferece seleção de horários.</div>`}${mode==='admin'?`<div class="card" style="margin-bottom:18px"><label>Filtrar mentorada</label><input class="input" placeholder="Digite parte do nome..." oninput="filterRows(this.value,'meetingRow')"></div>`:''}<div class="grid two">${ms.map(m=>`<div class="card meetingRow" data-key="${esc((getStudent(m.studentId)?.name||'').toLowerCase())}"><h2>${esc(m.title)}</h2><p>📅 ${fmt(m.date)} · ${esc(getStudent(m.studentId)?.name||'')}</p><p>${esc(m.notes||'Sem resumo cadastrado')}</p><div class="actionrow">${m.recording?button('▶ Abrir gravação',`window.open('${esc(m.recording)}','_blank','noopener')`,'soft'):chip('Gravação pendente','yellow')}${mode==='admin'?button('Editar encontro',`openModal('meeting','${m.id}')`,'white sm'):''}</div></div>`).join('')}</div>`}
function adminContracts(){return `${header('Central de contratos','Conferência, ajustes comerciais e modelo contratual principal.',button('⚙ Editar minuta principal',"setPage('settings')",'soft'))}<div class="notice">⚖️ Cole em Configurações o texto integral do contrato aprovado juridicamente. O modelo demonstrativo contém campos variáveis, mas <b>não</b> substitui um instrumento jurídico completo. PDFs assinados são apenas identificados por nome neste protótipo.</div><div class="card"><table class="table"><thead><tr><th>Mentorada</th><th>Estado</th><th>Documento declarado</th><th>Ações</th></tr></thead><tbody>${db.students.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${chip(docStatus[s.contract]?.[0]||'Pendente',docStatus[s.contract]?.[1]||'yellow')}</td><td>${esc(db.contractUploads[s.id]?.filename||'Nenhum arquivo')}</td><td>${button('Analisar',`openModal('contractReview','${s.id}')`,'soft sm')} ${button('Editar dados',`openModal('manageStudent','${s.id}')`,'white sm')}</td></tr>`).join('')}</tbody></table></div>`}

function downloadContract(id){let s=getStudent(id),d=db.diagnostics[id]||{},txt=db.settings.contractTemplate.replace(/{{nome}}/g,s.name).replace(/{{cpf}}/g,d.cpf||'A preencher').replace(/{{endereco}}/g,d.address||'A preencher').replace(/{{programa}}/g,s.program||'MEI').replace(/{{meses}}/g,s.months).replace(/{{encontros}}/g,s.meetings);let w=window.open('','_blank');if(!w){toast('Permita pop-ups para abrir a impressão em PDF.');return}w.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Contrato MEI</title><style>body{font:12pt Arial;color:#171717;line-height:1.6;padding:18mm}pre{white-space:pre-wrap;font:inherit}h1{text-align:center;font-size:16pt}@page{size:A4;margin:15mm}</style></head><body><h1>CONTRATO DE MENTORIA</h1><pre>'+esc(txt)+'</pre><script>window.onload=function(){setTimeout(()=>window.print(),400)}<\/script></body></html>');w.document.close();toast('Escolha “Salvar como PDF” na janela de impressão.')} 


/* ===== Magnética MEI V3: revisão de fluxos e interatividade ===== */
const $id=id=>document.getElementById(id);
let v3StudentList=true, v3FinanceStudentList=true, v3RewardStudentList=true, v3SelectedLesson=null, v3Month=new Date();
function v3Modal(title,body){return `<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal wide"><div class="modalhead"><div class="eyebrow">CENTRAL MAGNÉTICA · V3</div><h2>${esc(title)}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
const v3PrevModal=renderModal;
renderModal=function(){let p=modalPayload;
 if(modal==='assign'){let m=db.models.find(x=>x.id===p);if(!m)return '';return v3Modal('Aplicar modelo a uma ou várias mentoradas',`<p><b>${esc(m.title)}</b> · ${m.tasks.length} tarefas. Marque quantas mentoradas quiser ou selecione todas.</p><input class="input" placeholder="🔎 Digite o nome da mentorada" oninput="filterRows(this.value,'assignStudent')"><div style="margin:12px 0"><label><input type="checkbox" onchange="document.querySelectorAll('.assignCheck').forEach(c=>c.checked=this.checked)"> Selecionar todas</label></div><div class="checkbox-list">${db.students.map(s=>`<label class="minirow assignStudent" data-key="${esc((s.name+' '+s.email).toLowerCase())}"><span><input class="assignCheck" type="checkbox" value="${s.id}" ${s.id===studentId?'checked':''}> ${esc(s.name)}</span><small>${esc(s.email)}</small></label>`).join('')}</div>${field('Nome do novo quadro','aTitle',m.title)}${selectField('Prazo das tarefas','aDeadline',[['model','Usar prazo de cada tarefa'],['3','3 dias'],['7','7 dias'],['15','15 dias']],'model')}<div class="actionrow">${button('Aplicar e notificar selecionadas',`v3ApplyModel('${p}')`)}</div>`)}
 if(modal==='modelTask'){const [id,pos]=String(p).split('|');const m=db.models.find(x=>x.id===id),t=pos===undefined?null:m.tasks[Number(pos)];if(!m)return '';return v3Modal(t?'Editar tarefa do modelo':'Criar tarefa do modelo',`${field('Título da tarefa','mtTitle',t?.title||'')}<div class="fields">${selectField('Coluna','mtStatus',(m.columns||statuses.map(x=>x[0])).map(x=>[x,statuses.find(y=>y[0]===x)?.[1]||x]),t?.status||'todo')}${selectField('Cor do card','mtPriority',[['red','🔴 Vermelho'],['orange','🟠 Laranja'],['green','🟢 Verde'],['blue','🔵 Azul'],['purple','🟣 Roxo']],t?.priority||'purple')}${field('Prazo relativo, em dias','mtDays',t?.days??7,'number')}</div>${textarea('Objetivo e descrição completa','mtDescription',t?.description||'')}${textarea('Checklist de execução (uma ação por linha)','mtChecklist',(t?.checklist||[]).join('\n'))}${textarea('Links e referências (um por linha)','mtLinks',(t?.links||[]).join('\n'))}<div class="actionrow">${button('Salvar tarefa',`v3SaveModelTask('${id}',${pos===undefined?-1:Number(pos)})`)}${t?button('Excluir tarefa',`removeModelTask('${id}',${Number(pos)})`,'danger'):''}</div>`)}
 if(modal==='lessonDetail'){let l=db.lessons.find(x=>x.id===p);if(!l)return '';let steps=v3LessonSteps(l);let edit=mode==='admin';return v3Modal(l.title,`<div class="lesson-detail"><p><span class="mini-tag">ACADEMIA MEI · ESTUDO PRÁTICO</span></p><div class="lesson-section"><h3>🎯 O que você vai aprender</h3><p>${esc(l.description||`Você vai compreender ${l.title.toLowerCase()} e transformar a explicação em uma ação prática no seu negócio.`)}</p></div><div class="lesson-section"><h3>📚 Entenda antes de executar</h3><p>${esc(v3LessonExplain(l))}</p><div class="lesson-block"><b>Exemplo de aplicação</b><p>Faça um exercício usando o seu produto, sua cliente ideal e sua oferta real. Não copie a concorrência: identifique o que torna a sua proposta mais útil e específica.</p></div></div><div class="lesson-section"><h3>✅ Seu passo a passo prático</h3>${steps.map((step,i)=>`<label class="academy-check"><input type="checkbox" ${db.lessonChecks?.[studentId+'|'+l.id+'|'+i]?'checked':''} onchange="v3LessonCheck('${l.id}',${i},this.checked)"><span>${esc(step)}</span></label>`).join('')}</div><div class="lesson-section"><h3>📝 Aplique ao seu negócio</h3>${textarea('Registre suas respostas, links ou rascunhos','lessonNote',db.lessonNotes?.[studentId+'|'+l.id]||'')}${button('Salvar minhas anotações',`v3SaveLessonNote('${l.id}')`)} ${l.url?button('▶ Ir para a aula',`window.open('${esc(l.url)}','_blank','noopener')`,'soft'):''}</div>${edit?`<div class="actionrow">${button('✎ Editar conteúdo e link da aula',`openModal('lesson','${l.id}')`,'white')}</div>`:''}</div>`)}
 if(modal==='conquest'){let q=v3Quests().find(x=>x.id===p);if(!q)return '';return v3Modal('Solicitar validação da conquista',`<h3>🏆 ${esc(q.title)} · ${q.points} pontos</h3><p>Descreva o que realizou e envie uma evidência para que a mentora possa avaliar.</p>${textarea('O que você fez?','questDescription','')}${field('Link de evidência (opcional)','questLink','','url')}${button('Enviar conquista para aprovação',`v3ClaimQuest('${q.id}')`)}`)}
 if(modal==='eventV3'){return v3Modal('Adicionar compromisso pessoal',`${field('Título','evTitle','')}${field('Data','evDate',p||dateISO(),'date')}${field('Cor do card','evColor','#9656c5','color')}${textarea('Anotações','evNotes','')}${button('Salvar compromisso',`v3SaveEvent()`)}`)}
 return v3PrevModal()
};
function v3SaveEvent(){db.events.push({id:uid(),title:val('evTitle'),date:val('evDate'),color:val('evColor'),notes:val('evNotes'),audience:'self',studentId});save();closeModal()}
function v3LessonSteps(l){return [`Escreva, em suas palavras, o que significa ${l.title.toLowerCase()} para o seu negócio.`,`Pesquise três exemplos reais no seu nicho e anote o que fazem bem e o que você faria diferente.`,`Aplique o conceito ao seu produto ou serviço e registre o resultado concreto.`,`Crie uma primeira versão e verifique se ela é clara para alguém que não conhece sua marca.`,`Registre o link, arquivo ou rascunho produzido e defina o seu próximo ajuste.`]}
function v3LessonExplain(l){let x=l.title.toLowerCase();if(/persona|cliente ideal|público/.test(x))return 'Persona é um retrato de cliente que ajuda você a tomar decisões de comunicação. Comece por dificuldades, desejos, perguntas, hábitos e situações concretas; converse com possíveis clientes, pesquise comentários e dúvidas recorrentes e diferencie evidências de suposições.';if(/bio|perfil/.test(x))return 'Uma bio eficaz comunica quem você ajuda, qual transformação oferece, por que merece atenção e qual é o próximo passo. Avalie clareza, promessa verificável, provas e a coerência entre bio, conteúdo e página de destino.';if(/criativo|reels|conteúdo|carrossel/.test(x))return 'Planeje o conteúdo a partir de uma dúvida real: escolha um gancho específico, mostre uma demonstração útil, apresente evidências quando existirem e finalize com uma ação coerente. Teste formatos antes de concluir o que funciona.';if(/tráfego|meta|campanha|anúncio/.test(x))return 'Antes de anunciar, defina objetivo, público, orçamento, criativo, página de destino e métrica de sucesso. Acompanhe os dados ao longo do tempo, evitando tomar decisões com poucas impressões.';if(/oferta|infoproduto|preço|venda|funil/.test(x))return 'Uma oferta conecta problema, resultado esperado, entrega, preço, suporte e limites claros. Valide a demanda com conversas e vendas reais, e organize a jornada desde o primeiro contato até o pós-venda.';return `Nesta fase você vai aprender a organizar ${l.title.toLowerCase()} com critério, exemplos e execução. Comece pelo cenário atual, registre o que precisa mudar, faça uma primeira entrega e revise a partir dos resultados.`}
function v3LessonCheck(id,i,checked){db.lessonChecks ||= {};db.lessonChecks[studentId+'|'+id+'|'+i]=checked;save()}
function v3SaveLessonNote(id){db.lessonNotes ||= {};db.lessonNotes[studentId+'|'+id]=val('lessonNote');log(mode==='admin'?'admin':studentId,'lesson','Atualizou exercício da academia',studentId);toast('Anotações salvas neste navegador.')}
function v3SaveModelTask(id,i){let m=db.models.find(x=>x.id===id);if(!m)return;let t={title:val('mtTitle'),status:val('mtStatus'),priority:val('mtPriority'),days:Math.max(0,Number(val('mtDays'))||0),description:val('mtDescription'),checklist:val('mtChecklist').split('\n').filter(Boolean),links:val('mtLinks').split('\n').filter(Boolean)};if(!t.title)return toast('Digite o título');if(i<0)m.tasks.push(t);else m.tasks[i]={...m.tasks[i],...t};save();closeModal()}
function v3ApplyModel(id){const m=db.models.find(x=>x.id===id),ids=[...document.querySelectorAll('.assignCheck:checked')].map(e=>e.value);if(!m||!ids.length)return toast('Selecione ao menos uma mentorada.');for(const sid of ids){let b={id:uid(),studentId:sid,title:val('aTitle')||m.title,color:m.color,description:m.description,columns:[...(m.columns||statuses.map(x=>x[0]))]};db.boards.push(b);for(let t of m.tasks)db.tasks.push({id:uid(),boardId:b.id,title:t.title,status:t.status||'todo',priority:t.priority||'purple',due:plusDays(val('aDeadline')==='model'?t.days||7:Number(val('aDeadline'))||7),description:t.description||'',checklist:[...(t.checklist||[])],links:[...(t.links||[])],comments:[]});log('admin','board',`Novo plano de ação liberado: ${b.title}`,sid)}studentId=ids[0];page='boards';subPage=null;save();closeModal();toast(`Plano aplicado a ${ids.length} mentorada(s).`)}
function v3StudentPicker(target){return `<div class="card"><h2>Selecione uma mentorada</h2><p>Clique na linha para abrir o acompanhamento individual.</p><input class="input" placeholder="Buscar pelo nome, e-mail ou programa" oninput="filterRows(this.value,'studentChoose')"><div class="tablewrap"><table class="table"><thead><tr><th>Mentorada</th><th>Programa</th><th>Planos</th><th>Atividade</th><th>Ver</th></tr></thead><tbody>${db.students.map(s=>{let bs=db.boards.filter(b=>b.studentId===s.id),ts=db.tasks.filter(t=>bs.some(b=>b.id===t.boardId));return `<tr class="studentChoose student-table-row" data-key="${esc((s.name+' '+s.email+' '+s.program).toLowerCase())}" onclick="studentId='${s.id}';${target}List=false;subPage=null;render()"><td><b>${esc(s.name)}</b><br><small>${esc(s.email)}</small></td><td>${esc(s.program)}</td><td>${bs.length} quadros</td><td>${ts.filter(t=>t.status==='done').length}/${ts.length} tarefas feitas</td><td>Ver detalhes →</td></tr>`}).join('')}</tbody></table></div></div>`}
const v3OriginalBoards=boardsPage;
boardsPage=function(){if(mode==='admin'&&v3StudentList)return header('Planos de ação por mentorada','Encontre a aluna e abra todos os seus quadros Kanban.')+v3StudentPicker('v3Student');return v3OriginalBoards()};
const v3OriginalFinance=financePage;

const v3OriginalRewards=rewardsPage;
rewardsPage=function(){let current=v3OriginalRewards();if(mode==='admin'&&v3RewardStudentList)return header('Embaixadora Black · gestão','Indicações recebidas, aprovação das conquistas e pontos por aluna.',button('+ Lançar pontos',"openModal('points')"))+`<div class="card"><h2>Indicações recebidas</h2>${(db.referrals||[]).map(r=>`<div class="minirow"><span><b>${esc(r.name)}</b> · ${esc(getStudent(r.studentId)?.name)}<br><small>${esc(r.need||'')}</small></span>${button('WhatsApp',`v3WA('${r.id}')`,'soft sm')}</div>`).join('')||'<p>Sem indicações nesta demonstração.</p>'}</div><div class="card"><h2>Conquistas aguardando análise</h2>${(db.questsClaimed||[]).filter(x=>x.status==='review').map(c=>`<div class="minirow"><span>${esc(getStudent(c.studentId)?.name)} · ${esc(c.title)}<br><small>${esc(c.description)}</small></span>${button('Aprovar',`v3DecideQuest('${c.id}',true)`,'sm')} ${button('Recusar',`v3DecideQuest('${c.id}',false)`,'danger sm')}</div>`).join('')||'<p>Nenhuma pendência.</p>'}</div>`+v3StudentPicker('v3RewardStudent');if(mode==='student')current+=`<div class="card"><h2>🏆 Mapa da conquista</h2><p>Solicite aprovação das suas conquistas e acumule pontos após a validação da mentora.</p><div class="grid three">${v3Quests().map(q=>{let c=(db.questsClaimed||[]).find(x=>x.studentId===studentId&&x.questId===q.id);return `<div class="resource clickable" onclick="${c?'toast(\'Conquista já solicitada.\')':`openModal('conquest','${q.id}')`}"><b>${esc(q.title)}</b><p>${q.points} pontos</p>${chip(c?(c.status==='approved'?'Aprovada':c.status==='review'?'Em análise':'Recusada'):'Solicitar pontos',c?.status==='approved'?'green':'purple')}</div>`}).join('')}</div></div>`;return current};
function v3Quests(){return ['Defini minha persona','Criei meu primeiro infoproduto','Fiz minha primeira venda','Estruturei minha oferta','Publiquei minha página','Fiz meus primeiros 5 Reels','Organizei meu calendário','Configurei meu checkout','Criei minha primeira campanha','Analisei minhas métricas','Criei meu funil','Consegui um depoimento','Concluí o plano geral','Automatizei atendimento','Registrei meus resultados'].map((title,i)=>({id:'q'+i,title,points:(i+1)*20}))}
function v3ClaimQuest(id){let q=v3Quests().find(x=>x.id===id);db.questsClaimed ||= [];if(db.questsClaimed.some(x=>x.questId===id&&x.studentId===studentId))return toast('Solicitação já existe.');db.questsClaimed.push({id:uid(),questId:id,studentId,title:q.title,points:q.points,description:val('questDescription'),link:val('questLink'),status:'review'});log(studentId,'achievement','Enviou conquista para aprovação: '+q.title,studentId);closeModal()}
function v3DecideQuest(id,approved){let c=db.questsClaimed.find(x=>x.id===id);if(!c)return;c.status=approved?'approved':'rejected';if(approved)db.points.push({id:uid(),studentId:c.studentId,value:c.points,reason:'Conquista: '+c.title,date:dateISO()});log('admin','achievement',(approved?'Aprovou':'Recusou')+' conquista '+c.title,c.studentId);render()}
function v3WA(id){let r=db.referrals.find(x=>x.id===id);if(!r)return;let phone=(r.phone||'').replace(/\D/g,'');if(!phone)return toast('Sem WhatsApp');let msg=`Olá, ${r.name}! Recebemos uma indicação de ${getStudent(r.studentId)?.name}. Podemos conversar sobre ${r.need||'seus objetivos'}?`;window.open('https://wa.me/'+(phone.startsWith('55')?phone:'55'+phone)+'?text='+encodeURIComponent(msg),'_blank','noopener')}

function v3ColumnModal(id){let m=db.models.find(x=>x.id===id);let labels=statuses.map(x=>`<label class="minirow"><span><input type="checkbox" class="colCheck" value="${x[0]}" ${m.columns.includes(x[0])?'checked':''}> ${x[1]}</span></label>`).join('');modal='v3Columns';modalPayload=id;let overlay=v3Modal('Personalizar colunas do Kanban',`<p>Marque as etapas que deseja manter. Tarefas de colunas removidas voltarão para A fazer.</p>${labels}<div class="actionrow">${button('Salvar colunas',`v3SaveColumns('${id}')`)}</div>`);document.body.insertAdjacentHTML('beforeend',overlay)}

const gcal=(title,date,time,dur,details,link)=>{if(!date)return '';const d=String(date).replace(/-/g,'');let dates;if(time){const [h,m]=String(time).split(':').map(Number);const st=new Date(`${date}T${String(h).padStart(2,'0')}:${String(m||0).padStart(2,'0')}:00`);const en=new Date(st.getTime()+(dur||60)*60e3);const f=x=>x.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');dates=f(st)+'/'+f(en)}else dates=d+'/'+d;return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+dates+'&details='+encodeURIComponent((details||'')+(link?'\n\nLink: '+link:''))+(link?'&location='+encodeURIComponent(link):'')};
const ageOf=b=>{if(!b)return '';const d=new Date(b+'T12:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a>0&&a<120?a:''};
const daysToBday=b=>{if(!b)return 999;const n=new Date();n.setHours(0,0,0,0);const d=new Date(b+'T12:00:00');let x=new Date(n.getFullYear(),d.getMonth(),d.getDate());if(x<n)x=new Date(n.getFullYear()+1,d.getMonth(),d.getDate());return Math.round((x-n)/864e5)};
const isBdayToday=b=>daysToBday(b)===0;
