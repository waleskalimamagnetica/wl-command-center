<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central Magnética · Mentoria Escala Inteligente</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--panel:#fff;--panel2:#faf7f2;--ink:#1f1c18;--mute:#766e62;--stroke:#e7dfd2;--gold:#9c7330;--gold2:#c9a05a;--goldbg:#f6ecdb;--ok:#2f7d4f;--okbg:#e3f3e8;--warn:#a5650c;--warnbg:#fbefd9;--err:#b3261e;--errbg:#fbe4e2;--side:#121110;--sideink:#efe6d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0c0b;--panel:#171513;--panel2:#1d1a17;--ink:#f3ecdf;--mute:#a59c8e;--stroke:#2d2822;--gold:#e2b768;--gold2:#c79a4f;--goldbg:#2b2217;--ok:#8fd4a8;--okbg:#14261b;--warn:#f0c27a;--warnbg:#2c2213;--err:#f2b8b5;--errbg:#2e1716;--side:#090807}}
:root[data-theme="dark"]{--bg:#0d0c0b;--panel:#171513;--panel2:#1d1a17;--ink:#f3ecdf;--mute:#a59c8e;--stroke:#2d2822;--gold:#e2b768;--gold2:#c79a4f;--goldbg:#2b2217;--ok:#8fd4a8;--okbg:#14261b;--warn:#f0c27a;--warnbg:#2c2213;--err:#f2b8b5;--errbg:#2e1716;--side:#090807}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 Inter,system-ui,sans-serif}
a{color:var(--gold)}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;border-radius:999px;padding:9px 16px;border:1px solid var(--stroke);background:var(--panel);color:var(--ink);text-decoration:none}
.btn.p{background:linear-gradient(90deg,var(--gold),var(--gold2));border:0;color:#1a1408}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--stroke);border-radius:12px;padding:11px 13px;outline:none}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--gold2)}
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 12px}label.f>span{display:block;margin-bottom:5px}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 90% at 50% 0%,#2a241a 0%,#0e0d0b 65%)}
.auth .box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--stroke);border-radius:22px;padding:30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth .k{letter-spacing:.38em;font-size:11px;color:var(--gold);margin:0;text-align:center}
.auth h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;margin:4px 0 2px;text-align:center;line-height:1.1}
.auth p.s{color:var(--mute);text-align:center;margin:0 0 22px;font-size:14px}
.msg{border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:14px;display:none}.msg.err{display:block;background:var(--errbg);color:var(--err)}.msg.ok{display:block;background:var(--okbg);color:var(--ok)}
/* app */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sideink);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 8px 18px;border-bottom:1px solid #2a2520;margin-bottom:12px}.brand .k{letter-spacing:.32em;font-size:10px;color:#d9b46c}.brand b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;line-height:1.1;color:#f3ecdf}
.nav button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:var(--sideink);opacity:.82;padding:9px 10px;border-radius:10px;text-align:left;font-size:14.5px}
.nav button.on{background:#2a2219;color:#e2b768;opacity:1}.nav button:hover{opacity:1}
.nav .ic{width:22px;text-align:center}.nav .bd{margin-left:auto;background:#e2b768;color:#1a1408;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.side .foot{margin-top:18px;padding:12px 10px;border-top:1px solid #2a2520;font-size:12.5px;opacity:.8}
.main{padding:28px 32px 80px;max-width:1080px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.top h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;margin:0;line-height:1.1}
.top .s{color:var(--mute);margin:4px 0 0}
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:18px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:16px}.stat .l{color:var(--mute);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}.stat .v{font-size:26px;font-weight:700;margin-top:4px}.stat .x{color:var(--mute);font-size:13px}
.bar{height:9px;background:var(--stroke);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.hero{background:radial-gradient(120% 140% at 0% 0%,#2a241a 0%,#0e0d0b 70%);color:#f3ecdf;border-radius:20px;padding:24px;margin-bottom:16px;border:0}
.hero .k{letter-spacing:.24em;font-size:11px;color:#d9b46c;text-transform:uppercase}.hero h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;margin:4px 0 6px}.hero p{color:#d6ccba;margin:0}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--stroke)}.list .it:last-child{border:0}
.chk{width:22px;height:22px;flex:none;accent-color:var(--gold);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--panel2);border:1px solid var(--stroke);white-space:nowrap}
.tag.todo{color:var(--mute)}.tag.doing{background:#efe4f8;color:#7a3fb0;border-color:#e2d0f2}.tag.review{background:var(--warnbg);color:var(--warn);border-color:transparent}.tag.adjust{background:var(--errbg);color:var(--err);border-color:transparent}.tag.done{background:var(--okbg);color:var(--ok);border-color:transparent}
.tag.alta{background:var(--errbg);color:var(--err);border-color:transparent}.tag.media{background:var(--warnbg);color:var(--warn);border-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.doing{background:#2a1c36;color:#d3a8f5;border-color:transparent}}
.muted{color:var(--mute)}.small{font-size:13.5px}.tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.pre{white-space:pre-wrap}
.task{border:1px solid var(--stroke);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--panel)}
.task .t{font-weight:600}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow:auto;padding-bottom:6px}
.kan .col{background:var(--panel2);border:1px solid var(--stroke);border-radius:14px;padding:10px;min-height:120px}.kan .col h4{margin:2px 4px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--stroke);border-radius:99px;overflow:hidden}.seg button{border:0;background:none;padding:6px 12px;font-size:13px;color:var(--mute)}.seg button.on{background:var(--goldbg);color:var(--gold);font-weight:600}
.thread{border-left:3px solid var(--gold2);padding:6px 0 6px 12px;margin-top:10px}
.mtop{display:none}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 30% 0 0;z-index:30;transform:translateX(-105%);transition:transform .2s;height:100%}.side.open{transform:none}.mtop{display:flex;position:sticky;top:0;z-index:20;background:var(--side);color:var(--sideink);padding:12px 16px;align-items:center;gap:12px}.mtop b{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px}.mtop button{background:none;border:0;color:var(--sideink);font-size:22px}.main{padding:18px 16px 80px}.top h2{font-size:28px}.kan{grid-template-columns:repeat(5,82%)}}
.shade{display:none}@media (max-width:860px){.shade.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}}
</style>
</head>

(function () {

  /* ---------- telas de acesso ---------- */
  function authBox(inner) { root.innerHTML = '<div class="auth"><div class="box"><p class="k">CENTRAL</p><h1>Magnética</h1>' + inner + '</div></div>'; }
  function showLogin(msg, ok) {

      sb.auth.signInWithPassword({email: f.e.value.trim().toLowerCase(), password: f.p.value}).then(function (r) { if (r.error) throw r.error; return boot(); }).catch(function (err) { b.disabled = false; b.textContent = 'Entrar'; var m = document.getElementById('m'); m.className = 'msg err'; m.textContent = /invalid/i.test(err.message) ? 'E-mail ou senha incorretos.' : err.message; }); };

      if (j.error) { history.replaceState(null, '', location.pathname); return showLogin(j.error); }
      authBox('<p class="s">Olá' + (j.first ? ', ' + esc(j.first) : '') + '! Crie a sua senha para entrar na sua central.</p><div class="msg" id="m"></div><form id="ff"><label class="f"><span>Seu e-mail de acesso</span><input value="' + esc(j.email) + '" readonly></label><label class="f"><span>Crie uma senha (mínimo 8 caracteres)</span><input type="password" name="p" minlength="8" autocomplete="new-password" required></label><label class="f"><span>Repita a senha</span><input type="password" name="p2" autocomplete="new-password" required></label><button class="btn p" style="width:100%;justify-content:center;padding:12px">Criar senha e entrar</button></form>');
      document.getElementById('ff').onsubmit = function (e) { e.preventDefault(); var f = e.target, m = document.getElementById('m'), b = f.querySelector('button');
        if (f.p.value.length < 8) { m.className = 'msg err'; m.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
        if (f.p.value !== f.p2.value) { m.className = 'msg err'; m.textContent = 'As senhas não são iguais.'; return; }

        fetch(FN, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({t: t, password: f.p.value})}).then(function (r) { return r.json(); }).then(function (x) {
          if (x.error) throw new Error(x.error); history.replaceState(null, '', location.pathname);
          return sb.auth.signInWithPassword({email: x.email, password: f.p.value}).then(function (r) { if (r.error) throw r.error; return boot(); });
        }).catch(function (err) { b.disabled = false; b.textContent = 'Criar senha e entrar'; m.className = 'msg err'; m.textContent = err.message; }); };

  }

  /* ---------- dados ---------- */

  function save(now) { clearTimeout(S.saveT); S.saveT = setTimeout(function () { sb.rpc('wl_portal_save', {p: S.st}).then(function (r) { if (r.error) toast('Não salvou: ' + r.error.message, 1); }); }, now ? 0 : 700); }
  function toast(t, bad) { var d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:' + (bad ? 'var(--err)' : '#1f1c18') + ';color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;max-width:90%'; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }

  /* ---------- lógica ---------- */
