button{font:inherit;font-weight:600;border-radius:999px;padding:12px 22px;border:1px solid var(--stroke);background:transparent;color:var(--ink);cursor:pointer}
button.p{background:linear-gradient(90deg,var(--gold),var(--gold2));border:0;color:#1a1408}

.aceite input{margin-top:4px;accent-color:var(--gold);width:18px;height:18px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.done{text-align:center;padding:30px 6px}
.done .big{font-size:46px}
.err{background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err);border-radius:12px;padding:12px 14px;margin:0 0 16px;display:none}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}

  ];
  var TERMO = '<h3>MEI – MENTORIA ESCALA INTELIGENTE</h3><p>Seja bem-vinda à MEI – Mentoria Escala Inteligente. Antes de preencher seu formulário de diagnóstico e iniciar as etapas de estruturação, é necessário conhecer e reconhecer as condições essenciais de participação no programa. Este termo apresenta um resumo das principais regras de funcionamento da mentoria e complementa o contrato individual de prestação de serviços e licenciamento de materiais digitais, sem substituí-lo.</p>'
    + '<h3>1. DA NATUREZA E DURAÇÃO DO PROGRAMA</h3><p>A MEI é um programa de mentoria e acompanhamento estratégico com duração contratada de três meses, voltado à estruturação e ao desenvolvimento de operações digitais.</p><p>O programa compreende diagnóstico estratégico, orientação de implementação de inteligência artificial e automações, organização de processos, planejamento de conteúdo e vendas, acompanhamento individual, suporte e materiais digitais.</p><p>As orientações não representam promessa de faturamento, vendas, lucro ou execução integral do negócio pela CONTRATADA.</p>'
    + '<h3>2. DA DISPONIBILIZAÇÃO DOS MATERIAIS DIGITAIS</h3><p>A participante terá acesso aos ambientes e recursos contratados, incluindo:</p><ul><li>Área de Membros Aceleração Turbo;</li><li>Área de Membros Novembro Turbo;</li><li>Área de Membros de Gravações de Encontros;</li><li>Aplicativo Exclusivo da Mentoria;</li><li>Templates, checklists e prompts de inteligência artificial;</li><li>Planilhas de progresso;</li><li>Bibliotecas, conteúdos complementares e ferramentas organizadas no Notion.</li></ul><p><b>A participante declara estar ciente de que a disponibilização funcional dos ambientes e materiais, acompanhada da comunicação de acesso, caracteriza o início da oportunidade de utilização da licença contratada.</b></p><p>A decisão individual de não realizar login, não abrir arquivos, não assistir às gravações ou não utilizar os recursos disponibilizados não descaracteriza, por si só, a entrega funcional nem gera automaticamente desconto, extensão de acesso ou cancelamento de obrigações financeiras.</p><p>O acesso aos materiais é temporário e vinculado às condições da contratação. Não há concessão de acesso vitalício.</p><p>Essa disposição não elimina o direito de arrependimento legal quando aplicável, nem direitos relacionados a falhas de entrega, indisponibilidade ou restituições obrigatórias.</p>'
    + '<h3>3. DOS ENCONTROS INDIVIDUAIS</h3><p>A mentoria contempla quatro encontros individuais ao vivo, distribuídos da seguinte forma:</p><ul><li>Primeiro mês: dois encontros, sendo um de estruturação e um de acompanhamento;</li><li>Segundo mês: um encontro de acompanhamento;</li><li>Terceiro mês: um encontro de acompanhamento.</li></ul><p>Cada encontro possui duração contratada de 60 minutos, podendo ser excepcionalmente estendido até 90 minutos, exclusivamente por decisão e disponibilidade da CONTRATADA. A extensão eventual não gera direito a tempo adicional em encontros futuros.</p>'
    + '<h3>4. DOS AGENDAMENTOS, ATRASOS E FALTAS</h3><p>É responsabilidade da participante realizar os agendamentos dentro dos períodos mensais correspondentes. Os encontros não são automaticamente acumuláveis ou transferíveis para meses posteriores.</p><p><b>Quando a agenda for efetivamente disponibilizada e comunicada, com opções razoáveis de horários, a ausência injustificada de agendamento durante a janela mensal poderá resultar na expiração da respectiva oportunidade.</b></p><p>Atrasos injustificados superiores a dez minutos após o horário confirmado poderão resultar no encerramento da reserva e na contabilização da oportunidade como consumida, desde que a mentora esteja disponível e a regra tenha sido previamente informada.</p><p>Reagendamentos deverão ser solicitados com antecedência mínima de 24 horas, ressalvadas situações excepcionais justificadas. Falhas ou indisponibilidades atribuíveis à CONTRATADA serão tratadas mediante reposição adequada, conforme o contrato.</p>'
    + '<h3>5. DO SUPORTE E ACOMPANHAMENTO</h3><p>O suporte ocorrerá pelos canais oficiais, de segunda a sexta-feira, das 11h às 17h, horário de Brasília, exceto feriados aplicáveis.</p><p>A primeira resposta humana será fornecida até as 17h do próximo dia útil após o recebimento da solicitação. A primeira resposta não representa necessariamente a solução integral da demanda. Análises aprofundadas poderão demandar até sete dias úteis, conforme as condições contratuais e a complexidade da solicitação.</p><p>O suporte poderá ser realizado pela mentora ou por integrantes habilitados de sua equipe, não abrangendo atendimento instantâneo, plantão permanente ou execução operacional ilimitada.</p>'
    + '<h3>6. DAS RESPONSABILIDADES DA PARTICIPANTE</h3><p>A participante reconhece que deverá fornecer informações verdadeiras, preencher os diagnósticos, acompanhar as orientações, realizar os agendamentos e executar as atividades sob sua responsabilidade.</p><p>A mentoria oferece direcionamento estratégico e orientação assistida para implementação. Não significa que a CONTRATADA assumirá a administração integral da empresa, a contratação de ferramentas ou a execução de todas as tarefas operacionais. Os resultados dependerão de fatores como participação, implementação, decisões comerciais, investimentos, mercado e condições externas.</p>'
    + '<h3>7. DO INVESTIMENTO, DESISTÊNCIA E CANCELAMENTO</h3><p>A MEI é contratada por preço global, conforme a modalidade de pagamento individualmente aceita. O parcelamento não constitui assinatura mensal independente.</p><p>Após o prazo legal de arrependimento, quando aplicável, eventual desistência antecipada deverá ser comunicada pelos canais oficiais e será submetida às condições de apuração financeira estabelecidas no contrato. Essa apuração poderá considerar materiais e licenças efetivamente disponibilizados, períodos de acesso, diagnósticos realizados, encontros prestados ou oportunidades validamente consumidas, suporte, acompanhamento, serviços ainda não prestados e eventual multa compensatória juridicamente cabível.</p><p><b>A simples ausência de login, participação, agendamento ou utilização voluntária dos recursos não constitui cancelamento automático da contratação.</b></p><p>Permanecem assegurados os direitos de arrependimento, restituição e demais garantias legalmente obrigatórias, quando aplicáveis.</p><p><b>Entretanto, a CONTRATANTE declara estar ciente de que a MEI – Mentoria Escala Inteligente possui entregas imediatas e progressivas</b>, iniciadas a partir da disponibilização dos acessos aos grupos exclusivos, áreas de membros, aplicativos, bibliotecas, materiais digitais, templates, checklists, prompts, planilhas, encontros individuais, videochamadas com Waleska e demais recursos previstos na contratação.</p><p>A efetiva disponibilização desses recursos, acompanhada da respectiva comprovação, <b>caracteriza o cumprimento das obrigações de entrega correspondentes, independentemente de a CONTRATANTE optar por acessar, visualizar, assistir ou utilizar os conteúdos disponibilizados.</b></p><p>Em caso de desistência ou cancelamento após o prazo legal de arrependimento, <b>não haverá direito automático à devolução integral do investimento</b>, sendo considerados, para fins de apuração financeira, os materiais e licenças efetivamente disponibilizados, os serviços prestados, os encontros realizados ou oportunidades validamente consumidas e demais entregas comprovadas. Os respectivos valores poderão ser cobrados ou retidos conforme o contrato principal, observadas a proporcionalidade, a duração dos acessos, a vedação de cobrança duplicada e as hipóteses legais de restituição.</p><p><b>O aceite eletrônico deste formulário constitui reconhecimento expresso dessas condições e da natureza imediata e progressiva das entregas contratadas.</b></p>'
    + '<h3>8. DA PROPRIEDADE INTELECTUAL E CONFIDENCIALIDADE</h3><p>Todos os conteúdos, materiais, gravações, metodologias documentadas, apresentações, modelos originais e recursos protegidos permanecem pertencendo aos respectivos titulares. É proibido compartilhar credenciais, redistribuir materiais, revender conteúdos licenciados ou reproduzir substancialmente obras protegidas para exploração comercial não autorizada.</p><p>Também é vedada a utilização indevida dos nomes e sinais distintivos da CONTRATADA, incluindo InfoMagnético, Clone-se, Comunidade Magnética, Magnética e outros nomes juridicamente protegidos, de modo a provocar falsa associação, violação de direitos ou confusão comercial.</p><p>A participante deverá preservar informações confidenciais compartilhadas durante a mentoria, respeitados os limites legais e o exercício legítimo de direitos. Violações comprovadas poderão gerar medidas de cessação, responsabilização e penalidades juridicamente cabíveis previstas no contrato principal.</p>'
    + '<h3>9. DA CONDUTA E PARTICIPAÇÃO</h3><p>A participação nos grupos e ambientes exclusivos exige respeito à mentora, à equipe e às demais participantes. Não serão admitidos assédio, ameaças, divulgação ilícita de informações privadas, spam, compartilhamento indevido de conteúdos e outras condutas incompatíveis com a segurança dos ambientes. Descumprimentos graves poderão ocasionar medidas proporcionais de restrição de acesso ou resolução contratual, observadas as condições legais e contratuais.</p>'
    + '<h3>10. DO TRATAMENTO DOS DADOS PESSOAIS</h3><p>Os dados fornecidos neste formulário poderão ser utilizados para identificação, diagnóstico da operação, planejamento estratégico, comunicação, execução da mentoria, suporte, segurança, faturamento, elaboração do contrato e cumprimento de obrigações legais. O tratamento observará a Lei Geral de Proteção de Dados Pessoais (Lei nº 13.709/2018), as bases legais aplicáveis e as informações de privacidade disponibilizadas pela CONTRATADA.</p><p>Os dados não serão utilizados para divulgação publicitária identificável de depoimentos, imagem, voz ou resultados pessoais sem autorização específica, quando necessária. Solicitações referentes aos dados pessoais poderão ser encaminhadas ao e-mail: formulamagneticaa@gmail.com.</p>'
    + '<h3>11. DA CIÊNCIA E DO ACEITE ELETRÔNICO</h3><p>Ao marcar a opção de aceite e enviar o formulário, a participante declara que:</p><ul><li>Teve acesso ao conteúdo integral deste termo;</li><li>Leu e compreendeu as regras essenciais de funcionamento da MEI;</li><li>Reconhece as condições de acesso aos materiais, agendamento, suporte e participação;</li><li>Está ciente de que o uso voluntário dos recursos depende de sua iniciativa;</li><li>Reconhece que os resultados comerciais não são garantidos;</li><li>Compromete-se a fornecer informações verdadeiras;</li><li>Reconhece que este termo complementa, mas não substitui, as condições do contrato principal;</li><li>Está ciente de que seus dados serão tratados para as finalidades informadas.</li></ul><p><b>O aceite eletrônico poderá ser documentado mediante registro da data, horário, versão do termo, identificação da participante e evidências técnicas disponíveis, respeitada a legislação aplicável.</b></p><p>O presente termo não representa renúncia a direitos legalmente irrenunciáveis nem altera unilateralmente obrigações essenciais previstas na oferta e no contrato individual.</p><p><b>Foro contratual eleito:</b> Comarca de Bicas/MG, nos limites de validade da eleição de foro estabelecida no contrato principal e na legislação aplicável.</p><p><b>CONTRATADA:</b> 51.315.966 WALESKA VIDIGAL LIMA · <b>CNPJ:</b> 51.315.966/0001-59<br><b>MEI – Mentoria Escala Inteligente</b></p>';

  function cpfOk(v) { var c = String(v).replace(/\D/g, ''); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false; var s = 0, i; for (i = 0; i < 9; i++) s += +c[i] * (10 - i); var d1 = (s * 10) % 11 % 10; if (d1 !== +c[9]) return false; s = 0; for (i = 0; i < 10; i++) s += +c[i] * (11 - i); return (s * 10) % 11 % 10 === +c[10]; }
  function field(q) {
    var v = data[q.k] || ''; var req = q.r ? ' <span class="req">*</span>' : '';
    var h = q.h ? '<span class="h">' + esc(q.h) + '</span>' : '';
    var inp;
    if (q.radio) inp = '<div class="opts">' + q.radio.map(function (o) { return '<label><input type="radio" name="' + q.k + '" value="' + esc(o) + '"' + (v === o ? ' checked' : '') + '> ' + esc(o) + '</label>'; }).join('') + '</div>';
    else if (q.sel) inp = '<select name="' + q.k + '">' + q.sel.map(function (o) { return '<option value="' + esc(o) + '"' + (v === o ? ' selected' : '') + '>' + (o ? esc(o) : 'Escolha…') + '</option>'; }).join('') + '</select>';
    else if (q.long) inp = '<textarea name="' + q.k + '" placeholder="' + esc(q.ph || 'Escreva aqui') + '">' + esc(v) + '</textarea>';
    else inp = '<input type="' + (q.type || 'text') + '" name="' + q.k + '" value="' + esc(v) + '" placeholder="' + esc(q.ph || '') + '"' + (q.type === 'tel' ? ' inputmode="tel"' : '') + (q.cpf ? ' inputmode="numeric"' : '') + '>';
    return '<div class="q" data-q="' + q.k + '"><label class="t">' + esc(q.t) + req + '</label>' + h + inp + '<span class="msg">' + (q.cpf ? 'Confira o CPF.' : q.type === 'email' ? 'Confira o e-mail.' : 'Responda esta pergunta para continuar.') + '</span></div>';
  }
  function flat(qs) { var out = []; qs.forEach(function (q) { if (q.row) out = out.concat(q.row); else out.push(q); }); return out; }
  function render() {
    var S = STEPS[step]; var app = document.getElementById('app');
    var bar = '<div class="steps">' + STEPS.map(function (_, i) { return '<i class="' + (i <= step ? 'on' : '') + '"></i>'; }).join('') + '</div>';
    var body = S.termo ? '<div class="termo">' + TERMO + '</div><label class="aceite"><input type="checkbox" id="aceite"' + (accepted ? ' checked' : '') + '><span><b>Li e estou ciente</b> das condições iniciais de participação na MEI – Mentoria Escala Inteligente.</span></label><p class="note">Depois de enviar, a sua mentora revisa o seu contrato e você recebe o link para assinar.</p>'
      : S.q.map(function (q) { return q.row ? '<div class="row">' + q.row.map(field).join('') + '</div>' : field(q); }).join('');
    app.innerHTML = '<div class="err" id="err"></div>' + bar + '<p class="st">Etapa ' + (step + 1) + ' de ' + STEPS.length + '</p><h2>' + esc(S.t) + '</h2>' + (S.d ? '<p class="lead">' + esc(S.d) + '</p>' : '<div style="height:12px"></div>') + '<form id="f" novalidate><div class="hp"><input name="website" tabindex="-1" autocomplete="off"></div>' + body
      + '<div class="nav">' + (step ? '<button type="button" id="back">Voltar</button>' : '<span></span>') + '<button class="p" type="submit" id="next">' + (step === STEPS.length - 1 ? 'Enviar formulário' : 'Continuar') + '</button></div></form>';
    var f = document.getElementById('f');
    f.addEventListener('input', function (e) { if (e.target.name && e.target.name !== 'website') { data[e.target.name] = e.target.value; save(); var q = e.target.closest('.q'); if (q) q.classList.remove('bad'); } if (e.target.id === 'aceite') accepted = e.target.checked; });
    f.addEventListener('change', function (e) { if (e.target.type === 'radio' || e.target.tagName === 'SELECT') { data[e.target.name] = e.target.value; save(); var q = e.target.closest('.q'); if (q) q.classList.remove('bad'); } if (e.target.id === 'aceite') accepted = e.target.checked; });
    if (step) document.getElementById('back').onclick = function () { step--; render(); scrollTo(0, 0); };
    f.onsubmit = function (e) { e.preventDefault(); if (!check()) return; if (step < STEPS.length - 1) { step++; render(); scrollTo(0, 0); } else send(); };
  }
  function check() {
    var S = STEPS[step]; var bad = null;
    if (S.termo) { if (!document.getElementById('aceite').checked) { showErr('Marque que leu e está ciente do termo para enviar.'); return false; } return true; }
    flat(S.q).forEach(function (q) { var v = String(data[q.k] || '').trim(); var wrong = (q.r && !v) || (q.cpf && v && !cpfOk(v)) || (q.type === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)); var el = document.querySelector('[data-q="' + q.k + '"]'); if (el) el.classList.toggle('bad', !!wrong); if (wrong && !bad) bad = el; });
    if (bad) { bad.scrollIntoView({behavior: 'smooth', block: 'center'}); return false; } return true;
  }
  function showErr(m) { var e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; e.scrollIntoView({behavior: 'smooth', block: 'center'}); }
  function send() {
    var btn = document.getElementById('next'); btn.disabled = true; btn.textContent = 'Enviando…';
    var a = {}; STEPS.forEach(function (S) { if (S.q) flat(S.q).forEach(function (q) { a[q.k] = String(data[q.k] || '').trim(); }); });
    a.endereco = [a.rua, a.bairro, (a.cidade + (a.uf ? '/' + a.uf : '')), a.cep ? 'CEP ' + a.cep : ''].filter(Boolean).join(', ');
    var hp = document.querySelector('[name=website]').value;
    fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({k: k, answers: a, aceite: true, termoVersao: TERMO_VER, t0: t0, website: hp})})
      .then(function (r) { return r.json().then(function (x) { return [r.ok, x]; }); })
      .then(function (res) { if (!res[0] || res[1].error) throw new Error(res[1].error || 'Erro ao enviar'); try { localStorage.removeItem(KEY); } catch (e) {} done(); })
      .catch(function (e) { btn.disabled = false; btn.textContent = 'Enviar formulário'; showErr(e.message === 'Failed to fetch' ? 'Sem conexão. Suas respostas estão salvas: tente de novo.' : e.message); });
  }
  function done() { document.getElementById('saved').textContent = ''; document.getElementById('app').innerHTML = '<div class="done"><div class="big">✨</div><h2>Recebido! Obrigada.</h2><p class="lead">Suas respostas chegaram para a Waleska. Em breve você recebe o seu contrato para assinar e o link da agenda do primeiro encontro.</p></div>'; }
  function blocked(msg) { document.getElementById('app').innerHTML = '<div class="done"><div class="big">🔒</div><h2>Link indisponível</h2><p class="lead">' + esc(msg) + '</p></div>'; }
  if (!k) return blocked('Este formulário abre pelo link individual que a sua mentora enviou. Peça o seu link para ela.');
  fetch(API + '?k=' + encodeURIComponent(k)).then(function (r) { return r.json(); }).then(function (j) {
    if (j.error) return blocked(j.error);
    if (j.used) return blocked('Este formulário já foi enviado. Se precisar corrigir algo, fale com a sua mentora.');
    if (j.first) document.getElementById('hi').textContent = 'Seja bem-vinda, ' + j.first + '! Este é o formulário da sua entrada na mentoria e da sua sessão de análise de negócios, o nosso primeiro encontro.';
    if (j.email && !data.email) data.email = j.email;
    render();
  }).catch(function () { blocked('Não consegui abrir o formulário agora. Confira a internet e tente de novo.'); });
})();
</script>
